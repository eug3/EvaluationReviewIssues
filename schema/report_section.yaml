# ============================================================
# 报告结构 → 底稿支撑需求 (Report Structure & Workpaper Support)
#
# 依据：
#   - 财政部《资产评估基本准则》(财资〔2017〕43号)
#   - 中评协《资产评估执业准则——资产评估报告》(中评协〔2018〕35号)
#   - 中评协《资产评估执业准则——资产评估程序》(中评协〔2018〕36号)
#   - 中评协《资产评估执业准则——资产评估档案》(中评协〔2018〕37号)
#   - 中评协《资产评估执业准则——资产评估方法》(中评协〔2019〕35号)
#   - 中评协《资产评估执业准则——企业价值》(中评协〔2018〕38号)
#   - 《企业国有资产评估报告指南》(中评协，2008；国资项目报告/说明框架沿用)
#
# 用途：
#   1. S1 报告命题抽取时作为章节框架与归类依据
#   2. S2 追问生成时确定「该章节需要底稿提供什么」
#   3. S4 判定时给 if_absent 的默认 verdict / severity
# ============================================================

