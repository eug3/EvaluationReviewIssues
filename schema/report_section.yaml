# ------------------------------------------------------------
# 底稿分类（依据《资产评估档案》准则第 9-11 条）与常见载体
# ------------------------------------------------------------
workpaper_taxonomy:
  management:
    name: 管理类工作底稿
    standard: "archive-2018 §9-10"
    typical:
      - 业务基本事项记录
      - 资产评估委托合同
      - 资产评估计划
      - 重大问题处理记录
      - 内部审核意见
  operation:
    name: 操作类工作底稿
    standard: "archive-2018 §9, §11"
    typical:
      - 现场调查记录与相关资料（评估明细表、权属证明、历史/预测/财务/审计资料、承诺函、勘查/询问/函证记录）
      - 收集的评估资料（市场调查与数据分析、询价记录、专家报告）
      - 评定估算过程记录（重要参数选取与形成过程、价值分析/计算/判断过程、结论形成过程、沟通记录）
  artifacts:
    statement:
      name: 评估说明
      note: 报告附带资料，逐章节展开报告正文；国资项目随报告报送备案核准
    detail_table:
      name: 评估明细表（资产基础法）
      note: "科目明细表 + 各级汇总表；列示账面价值/评估价值/增减值/增值率"
    dcf_workpaper:
      name: 收益法底稿
      note: 报表及调整、收入/成本/税金/费用/折旧摊销/营运资金/资本性支出预测、收益表、FCFF、折现率、非经营性资产与溢余资产
    market_workpaper:
      name: 市场法底稿
      note: 可比公司/交易案例数据、报表调整、价值比率、分成率、WACC、控制权与流动性调整
    attachment:
      name: 报告附件
      note: "见 report-2018 §28；国资指南 §26"
    third_party:
      name: 其他机构报告
      note: 专项审计报告、专家报告等；引用时需说明取得过程并承担责任

# ------------------------------------------------------------
# 报告结构（封面/声明/摘要/正文/附件/附带资料）
# ------------------------------------------------------------
report_sections:

  - id: cover
    order: 0
    group: 前置
    name: 封面（标题、文号、册数、编制依据）
    standard_basis: ["report-2018 §8, §11", "soe-guide §7"]
    report_must_state:
      - 按「企业名称+经济行为关键词+评估对象+资产评估报告」命名
      - 评估机构特征字+种类特征字+年份+报告序号
      - 装订总册数与册序号
    claim_types: []
    workpaper_support:
      - id: WP-COVER-01
        workpaper_type: management
        expected: 资产评估委托合同（确认经济行为、评估对象、报告使用人）
        where: 附件十 / 管理类底稿
        question_group: purpose
        if_absent: { verdict: missing, severity: low }

  - id: declaration
    order: 1
    group: 前置
    name: 声明
    standard_basis: ["report-2018 §12", "soe-guide §8"]
    report_must_state:
      - 依据基本准则与执业准则编制
      - 使用范围与责任划分
      - 评估对象权属由委托人申报确认
      - 独立性与利益关系声明
    claim_types: []
    workpaper_support:
      - id: WP-DEC-01
        workpaper_type: management
        expected: 委托人及被评估单位对申报资料的确认（签字/盖章/其他方式）
        where: 资产评估明细表签章页、资料确认记录
        question_group: purpose
        if_absent: { verdict: missing, severity: medium }
      - id: WP-DEC-02
        workpaper_type: attachment
        expected: 现场调查记录、权属查验记录（支撑"已作必要关注与查验"）
        where: 操作类底稿—现场调查记录
        question_group: limitation
        if_absent: { verdict: insufficient, severity: medium }

  - id: abstract
    order: 2
    group: 前置
    name: 报告摘要
    standard_basis: ["report-2018 §13", "soe-guide §9"]
    report_must_state:
      - 经济行为、评估目的、评估对象与范围、价值类型、基准日、方法
      - 评估结论及使用有效期
      - 对结论有影响的特别事项
    claim_types: [disclosure, conclusion]
    workpaper_support:
      - id: WP-ABS-01
        workpaper_type: artifacts.statement
        expected: 评估说明中与摘要逐字段对应的内容
        where: 评估说明相应章节
        question_group: disclosure
        if_absent: { verdict: missing, severity: medium }
      - id: WP-ABS-02
        workpaper_type: artifacts.detail_table
        expected: 评估结果汇总表（金额、增减值）与摘要金额一致
        where: 评估明细表「1-汇总表」
        question_group: conclusion
        if_absent: { verdict: missing, severity: high }

  - id: party
    order: 3
    group: 正文
    name: 一、委托人、被评估单位和委托合同约定的其他报告使用人概况
    standard_basis: ["report-2018 §14(一), §15", "soe-guide §12", "enterprise-2018 §8"]
    report_must_state:
      - 委托人、被评估单位名称/住所/法定代表人/注册资本/经营范围
      - 股东及持股比例、股权变更、经营管理结构、历史沿革
      - 近三年资产财务经营状况、关联交易、产权关系
    claim_types: [purpose, object_scope]
    workpaper_support:
      - id: WP-PARTY-01
        workpaper_type: attachment
        expected: 委托人及被评估单位营业执照、产权登记证、公司章程、出资/验资/股权证明
        where: 附件三、附件四
        question_group: purpose
        if_absent: { verdict: missing, severity: high }
      - id: WP-PARTY-02
        workpaper_type: operation
        expected: 尽职调查记录（历史沿革、股东结构、经营与财务状况、关联交易）
        where: 操作类底稿—现场调查记录
        question_group: purpose
        if_absent: { verdict: missing, severity: medium }
      - id: WP-PARTY-03
        workpaper_type: third_party
        expected: 近三年财务报表或专项审计报告
        where: 附件二、被评估单位财务资料
        question_group: calculation
        if_absent: { verdict: missing, severity: high }

  - id: purpose
    order: 4
    group: 正文
    name: 二、评估目的
    standard_basis: ["report-2018 §14(二), §16", "soe-guide §13", "basic-2017 §23"]
    report_must_state:
      - 与本次评估对应的经济行为
      - 经济行为批准情况或依据
      - 评估目的唯一
    claim_types: [purpose]
    workpaper_support:
      - id: WP-PUR-01
        workpaper_type: attachment
        expected: 经济行为批准文件（会议纪要/批复/决议）
        where: 附件一（经济行为文件）
        question_group: purpose
        if_absent: { verdict: missing, severity: high }
      - id: WP-PUR-02
        workpaper_type: management
        expected: 业务基本事项记录中评估目的的记载
        where: 管理类工作底稿
        question_group: purpose
        if_absent: { verdict: insufficient, severity: medium }

  - id: object_scope
    order: 5
    group: 正文
    name: 三、评估对象和评估范围
    standard_basis: ["report-2018 §14(三), §17", "soe-guide §14", "enterprise-2018 §9, §36"]
    report_must_state:
      - 评估对象（企业整体价值/股东全部权益/股东部分权益）
      - 评估范围（资产、负债清单与账面金额）
      - 与委托合同、经济行为涉及范围是否一致
      - 账面记录或未记录的无形资产、表外资产
      - 重要单项资产的权属、经济、物理状况
    claim_types: [object_scope, legal_basis]
    workpaper_support:
      - id: WP-OBJ-01
        workpaper_type: artifacts.detail_table
        expected: 评估明细表「参数设置」+ 各级汇总表，列示科目与账面价值
        where: 评估明细表「1-汇总表 / 2-分类汇总」
        question_group: object_scope
        if_absent: { verdict: missing, severity: high }
      - id: WP-OBJ-02
        workpaper_type: artifacts.statement
        expected: 评估说明「评估对象与评估范围说明」，含实物资产分布、无形资产、表外资产
        where: 评估说明 第三部分一（一）-（五）
        question_group: object_scope
        if_absent: { verdict: missing, severity: medium }
      - id: WP-OBJ-03
        workpaper_type: operation
        expected: 资产核实记录（账、表、实相符；盘点和现场勘查；权属查验）
        where: 操作类底稿—现场调查记录；评估说明「资产核实情况总体说明」
        question_group: object_scope
        if_absent: { verdict: insufficient, severity: high }
      - id: WP-OBJ-04
        workpaper_type: operation
        expected: 表外资产/负债识别记录，并经委托人确认纳入申报范围
        where: 评估申报文件、确认记录
        question_group: object_scope
        if_absent: { verdict: missing, severity: medium }

  - id: value_type
    order: 6
    group: 正文
    name: 四、价值类型
    standard_basis: ["report-2018 §14(四), §18", "soe-guide §15", "enterprise-2018 §10"]
    report_must_state:
      - 价值类型名称及其定义
      - 选择该价值类型的理由
    claim_types: [value_type]
    workpaper_support:
      - id: WP-VAL-01
        workpaper_type: management
        expected: 业务基本事项记录中与委托合同一致的价值类型约定
        where: 管理类工作底稿 / 资产评估委托合同
        question_group: value_type
        if_absent: { verdict: missing, severity: medium }
      - id: WP-VAL-02
        workpaper_type: operation
        expected: 价值类型选择的判断记录（结合评估目的、市场条件、评估对象自身条件）
        where: 操作类底稿—评定估算过程记录
        question_group: value_type
        if_absent: { verdict: insufficient, severity: medium }

  - id: base_date
    order: 7
    group: 正文
    name: 五、评估基准日
    standard_basis: ["report-2018 §14(五), §19", "soe-guide §16"]
    report_must_state:
      - 评估基准日具体日期
      - 确定基准日所考虑的主要因素
      - 与委托合同一致
    claim_types: [base_date]
    workpaper_support:
      - id: WP-BAS-01
        workpaper_type: management
        expected: 委托合同中约定的评估基准日
        where: 管理类工作底稿 / 资产评估委托合同
        question_group: base_date
        if_absent: { verdict: missing, severity: high }
      - id: WP-BAS-02
        workpaper_type: third_party
        expected: 与基准日一致的专项审计报告或财务报表（数据截止日）
        where: 附件二
        question_group: base_date
        if_absent: { verdict: missing, severity: high }
      - id: WP-BAS-03
        workpaper_type: operation
        expected: 基准日后重大事项（期后事项）核查记录
        where: 操作类底稿；报告特别事项
        question_group: base_date
        if_absent: { verdict: insufficient, severity: medium }

  - id: basis
    order: 8
    group: 正文
    name: 六、评估依据
    standard_basis: ["report-2018 §14(六), §20", "soe-guide §17"]
    report_must_state:
      - 经济行为依据（有效批复文件）
      - 法律法规依据、评估准则依据
      - 权属依据、取价依据及其他参考依据
    claim_types: [legal_basis]
    workpaper_support:
      - id: WP-BASIS-01
        workpaper_type: attachment
        expected: 经济行为批复、权属证明资料（不动产权证/专利/商标等）、重要合同协议
        where: 附件一、附件四、附件十一（重要取价依据）
        question_group: legal_basis
        if_absent: { verdict: missing, severity: high }
      - id: WP-BASIS-02
        workpaper_type: operation
        expected: 取价依据资料（询价记录、市场调查与数据分析、统计资料、参数资料）
        where: 操作类底稿—收集的评估资料
        question_group: legal_basis
        if_absent: { verdict: missing, severity: medium }
      - id: WP-BASIS-03
        workpaper_type: management
        expected: 所引用准则/法规现行有效性的核对记录
        where: 操作类底稿—评定估算过程记录
        question_group: legal_basis
        if_absent: { verdict: insufficient, severity: low }

  - id: method
    order: 9
    group: 正文
    name: 七、评估方法
    standard_basis: ["report-2018 §14(七), §21", "method-2019 §21-24", "enterprise-2018 §17-39, §45", "soe-guide §18"]
    report_must_state:
      - 所选评估方法及选择理由
      - 不采用其他基本方法的适用性/操作条件受限原因
      - 采用两种以上方法时的结果差异、原因与最终结论确定依据
      - 方法的运用和逻辑推理过程、主要参数来源与测算过程
    claim_types: [method, parameter, calculation]
    workpaper_support:
      - id: WP-MET-01
        workpaper_type: artifacts.statement
        expected: 评估说明「评估方法的选择」及方法适用性分析（收益可预测性/可比性/资料条件）
        where: 评估说明 第三部分三（一）
        question_group: method
        if_absent: { verdict: insufficient, severity: high }
      - id: WP-MET-02
        workpaper_type: artifacts.dcf_workpaper
        expected: 收益法完整底稿：report-2018 §45 要求的方法运用过程与主要参数来源；国资指南 §32 要求的十三张明细表须齐备
        standard_ref: "soe-guide §32; enterprise-2018 §23-28, §45"
        required_tables:
          - 资产负债、利润调整表
          - 现金流量测算表
          - 营业收入预测表
          - 营业成本预测表
          - 营业税金及附加预测表
          - 销售费用预测表
          - 管理费用预测表
          - 财务费用预测表
          - 营运资金预测表
          - 折旧摊销预测表
          - 资本性支出预测表
          - 折现率计算表
          - 溢余资产和非经营性资产分析表
        where: 收益法底稿（如「1报表…13FCFF」sheet 链；参数/假设见「预测思路说明」）
        question_group: method
        if_absent: { verdict: missing, severity: high }
      - id: WP-MET-03
        workpaper_type: artifacts.market_workpaper
        expected: 市场法完整底稿：可比公司/交易案例数据、报表调整、价值比率、分成率、WACC、控制权与流动性调整、评估值
        where: 市场法底稿（如「数据提取…评估值」sheet 链）
        question_group: method
        if_absent: { verdict: missing, severity: high }
      - id: WP-MET-04
        workpaper_type: operation
        expected: 方法适用性与操作条件受限的判断记录；采用一种方法时的原因分析
        where: 操作类底稿—评定估算过程记录
        question_group: method
        if_absent: { verdict: insufficient, severity: high }

  - id: procedure
    order: 10
    group: 正文
    name: 八、评估程序实施过程和情况
    standard_basis: ["report-2018 §14(八), §22", "program-2018 §5-26", "soe-guide §19"]
    report_must_state:
      - 接受委托、明确基本事项、拟定计划
      - 指导清查、核实资产、验证资料
      - 选择方法、收集市场信息与估算
      - 结果汇总、结论分析、撰写报告与内部审核
      - 程序受限情况及弥补措施
    claim_types: [disclosure, assumption]
    workpaper_support:
      - id: WP-PRO-01
        workpaper_type: management
        expected: 业务基本事项记录、委托合同、评估计划、重大问题处理记录、内部审核意见
        where: 管理类工作底稿（档案准则 §10）
        question_group: disclosure
        if_absent: { verdict: missing, severity: high }
      - id: WP-PRO-02
        workpaper_type: operation
        expected: 现场调查记录（询问/访谈/核对/监盘/勘查）、函证记录、资料核查验证记录
        where: 操作类底稿—现场调查记录
        question_group: disclosure
        if_absent: { verdict: missing, severity: high }
      - id: WP-PRO-03
        workpaper_type: artifacts.statement
        expected: 评估说明「资产核实情况总体说明」：人员组织、实施时间与过程、影响核实的事项及处理、核实结论
        where: 评估说明 第三部分二
        question_group: disclosure
        if_absent: { verdict: missing, severity: medium }
      - id: WP-PRO-04
        workpaper_type: operation
        expected: 无法核查验证事项的说明及其对结论影响的分析
        where: 操作类底稿—评定估算过程记录；报告特别事项
        question_group: limitation
        if_absent: { verdict: insufficient, severity: high }

  - id: assumption
    order: 11
    group: 正文
    name: 九、评估假设
    standard_basis: ["report-2018 §14(九), §23", "program-2018 §20", "enterprise-2018 §23", "soe-guide §20"]
    report_must_state:
      - 基本假设（持续经营、交易、公开市场）
      - 具体假设（宏观、利率汇率税收、会计政策、经营、资质、合约、补贴、气候等）
      - 假设对评估结论的影响
    claim_types: [assumption]
    workpaper_support:
      - id: WP-ASM-01
        workpaper_type: artifacts.dcf_workpaper
        expected: 收益预测假设条件说明与预测思路（与报告假设一致）
        where: 收益法底稿「预测思路说明」「3收入」等
        question_group: assumption
        if_absent: { verdict: missing, severity: high }
      - id: WP-ASM-02
        workpaper_type: operation
        expected: 假设成立性的核实记录（资质、合约、补贴文件、租赁合同等）
        where: 操作类底稿—现场调查记录
        question_group: assumption
        if_absent: { verdict: insufficient, severity: medium }
      - id: WP-ASM-03
        workpaper_type: artifacts.statement
        expected: 评估说明「收益预测的假设条件」
        where: 评估说明 第三部分三（四）3
        question_group: assumption
        if_absent: { verdict: missing, severity: medium }

  - id: conclusion
    order: 12
    group: 正文
    name: 十、评估结论
    standard_basis: ["report-2018 §14(十), §24", "basic-2017 §26", "soe-guide §21"]
    report_must_state:
      - 文字与数字形式表述的评估结论
      - 资产基础法下资产负债净资产账面价值、评估价值及增减幅度，并附评估结果汇总表
      - 采用两种以上方法的评估价值、差异原因与最终结论确定理由
      - 评估结论使用有效期
    claim_types: [conclusion, change_analysis, disclosure]
    workpaper_support:
      - id: WP-CON-01
        workpaper_type: artifacts.detail_table
        expected: 评估明细表「1-汇总表」资产评估结果汇总表（账面价值/评估价值/增减值/增值率）
        where: 评估明细表「1-汇总表」「2-分类汇总」
        question_group: conclusion
        if_absent: { verdict: missing, severity: high }
      - id: WP-CON-02
        workpaper_type: artifacts.statement
        expected: 评估说明「评估结论及分析」及结论汇总表
        where: 评估说明 第三部分四
        question_group: conclusion
        if_absent: { verdict: missing, severity: high }
      - id: WP-CON-03
        workpaper_type: artifacts.dcf_workpaper
        expected: 收益法评估结果表、FCFF 与折现计算过程（可复算到结论金额）
        where: 收益法底稿「12收益表」「13FCFF」
        question_group: calculation
        if_absent: { verdict: missing, severity: high }
      - id: WP-CON-04
        workpaper_type: operation
        expected: 两种方法结果的比较分析与最终结论确定依据的记录
        where: 操作类底稿—评定估算过程记录
        question_group: conclusion
        if_absent: { verdict: insufficient, severity: high }

  - id: special_matters
    order: 13
    group: 正文
    name: 十一、特别事项说明
    standard_basis: ["report-2018 §14(十一), §25", "basic-2017 §27", "soe-guide §22"]
    report_must_state:
      - 权属资料不完整或瑕疵
      - 委托人未提供的其他关键资料
      - 未决事项、法律纠纷
      - 利用专家工作及相关报告
      - 重大期后事项、程序受限及弥补措施
      - 担保/租赁/或有负债等
    claim_types: [limitation, legal_basis]
    workpaper_support:
      - id: WP-SPEC-01
        workpaper_type: operation
        expected: 权属瑕疵、资料缺失、程序受限的核查与处理记录
        where: 操作类底稿—现场调查记录；评估说明「影响资产核实的事项及处理方法」
        question_group: limitation
        if_absent: { verdict: missing, severity: high }
      - id: WP-SPEC-02
        workpaper_type: third_party
        expected: 引用其他机构报告的原件/复印件及对取得过程的了解记录
        where: 附件二；操作类底稿
        question_group: limitation
        if_absent: { verdict: missing, severity: high }
      - id: WP-SPEC-03
        workpaper_type: operation
        expected: 担保、租赁、或有负债等事项的性质、金额及与评估对象关系的记录
        where: 操作类底稿；收益法底稿「租赁合同统计」等
        question_group: limitation
        if_absent: { verdict: missing, severity: medium }

  - id: limitation
    order: 14
    group: 正文
    name: 十二、资产评估报告使用限制说明
    standard_basis: ["report-2018 §14(十二), §26", "basic-2017 §28", "soe-guide §23"]
    report_must_state:
      - 使用范围；越权使用免责；使用人范围
      - 正确理解评估结论
      - 使用有效期与程序受限造成的使用限制
    claim_types: [limitation]
    workpaper_support:
      - id: WP-LIM-01
        workpaper_type: management
        expected: 业务基本事项记录中报告使用范围与报告使用人的约定
        where: 管理类工作底稿 / 委托合同
        question_group: limitation
        if_absent: { verdict: insufficient, severity: low }
      - id: WP-LIM-02
        workpaper_type: operation
        expected: 程序受限情况记录（对应报告使用限制中"程序受限"一项）
        where: 操作类底稿—评定估算过程记录
        question_group: limitation
        if_absent: { verdict: missing, severity: medium }

  - id: report_date
    order: 15
    group: 正文
    name: 十三、资产评估报告日
    standard_basis: ["report-2018 §14(十三), §27", "soe-guide §24"]
    report_must_state:
      - 评估结论形成日期；可与签署日不同
    claim_types: [base_date]
    workpaper_support:
      - id: WP-DATE-01
        workpaper_type: management
        expected: 内部审核意见与结论形成过程记录（支撑报告日）
        where: 管理类工作底稿—审核意见
        question_group: disclosure
        if_absent: { verdict: insufficient, severity: low }

  - id: signature
    order: 16
    group: 正文
    name: 十四、签名和盖章
    standard_basis: ["report-2018 §8, §14(十四)", "soe-guide §25"]
    report_must_state:
      - 至少两名资产评估专业人员（法定业务为资产评估师）签名
      - 加盖评估机构印章
    claim_types: []
    workpaper_support:
      - id: WP-SIGN-01
        workpaper_type: attachment
        expected: 评估机构备案文件/资格证明、签字人员资格证明、机构营业执照副本
        where: 附件七、附件八、附件九
        question_group: legal_basis
        if_absent: { verdict: missing, severity: medium }

  - id: attachments
    order: 17
    group: 附件
    name: 报告附件
    standard_basis: ["report-2018 §28", "soe-guide §26"]
    report_must_state:
      - 主要权属证明资料
      - 承诺函（委托人及相关当事人、签字评估师）
      - 机构及人员备案/资格文件
      - 评估汇总表或明细表
      - 账面价值与评估结论存在较大差异的说明
    claim_types: [legal_basis]
    workpaper_support:
      - id: WP-ATT-01
        workpaper_type: attachment
        expected: "经济行为文件、专项审计报告、营业执照、产权登记证、权属证明、承诺函、机构与人员资格、委托合同、重要取价依据"
        where: 附件一至附件十一
        question_group: legal_basis
        if_absent: { verdict: missing, severity: high }
      - id: WP-ATT-02
        workpaper_type: operation
        expected: 账面价值与评估结论存在较大差异时的说明
        where: 操作类底稿—评定估算过程记录
        question_group: change_analysis
        if_absent: { verdict: missing, severity: medium }

  # ---- 报告附带资料（国资项目随报告报送） ----

  - id: detail_table
    order: 18
    group: 附带资料
    name: 评估明细表
    standard_basis: ["soe-guide §30-34", "enterprise-2018 §35-38"]
    report_must_state:
      - 科目评估明细表 + 各级汇总表
      - 表头含科目名称、被评估单位、基准日、表号、金额单位、页码
      - 表内含明细名称、经营/事项内容、技术参数、发生日期、账面价值、评估价值、增减幅度
      - 表尾含填表人、填表日期和评估人员
    claim_types: [object_scope, conclusion, calculation]
    workpaper_support:
      - id: WP-DT-01
        workpaper_type: artifacts.detail_table
        expected: 参数设置页（填表人/评估人员/日期）+ 可见明细表 + 汇总表引用链完整
        where: 评估明细表「参数设置」「1-汇总表」至末级明细
        question_group: object_scope
        if_absent: { verdict: missing, severity: high }
      - id: WP-DT-02
        workpaper_type: third_party
        expected: 与被评估单位账面记录/审计报告一致的账面价值
        where: 专项审计报告、财务报表
        question_group: calculation
        if_absent: { verdict: missing, severity: high }
      - id: WP-DT-03
        workpaper_type: artifacts.dcf_workpaper
        expected: 收益法明细表表头含评估参数/预测项目名称、被评估单位、评估基准日、表号、金额单位；多被评估单位分别归集
        standard_ref: "soe-guide §32-34"
        where: 收益法底稿各预测表、「汇总表」sheet
        question_group: calculation
        if_absent: { verdict: insufficient, severity: medium }

  - id: statement
    order: 19
    group: 附带资料
    name: 评估说明
    standard_basis: ["soe-guide §35-38", "soe-guide 附4《资产评估说明》编写指引", "archive-2018 §16（评估说明可电子介质）"]
    report_must_state:
      - "§36 评估说明使用范围声明（供国资监管机构、相关监管机构和部门使用）"
      - "§37 《企业关于进行资产评估有关事项的说明》7项：委托人/被评估单位概况、经济行为、评估对象与范围、评估基准日、可能影响评估工作的重大事项、资产负债与未来经营收益预测、资料清单；须单位负责人签名盖章"
      - "§38 《资产评估说明》4项：评估对象与评估范围说明、资产核实总体情况说明、评估技术说明、评估结论及分析"
      - "§40 资产核实总体情况说明含人员组织、实施时间、核实过程、影响事项及处理方法、核实结论"
      - "§43-44 收益法/市场法评估技术说明含宏观区域经济、行业、业务、资产财务分析与调整、方法运用过程"
    claim_types: [disclosure]
    workpaper_support:
      - id: WP-ST-01
        workpaper_type: artifacts.statement
        expected: 评估说明与报告正文逐章节对应，§38 四项齐备，不得只写结论不写依据
        standard_ref: "soe-guide §35-44"
        where: 评估说明全文
        question_group: disclosure
        if_absent: { verdict: missing, severity: high }
      - id: WP-ST-03
        workpaper_type: operation
        expected: "§37 企业说明的签名盖章与日期（委托人单位负责人、被评估单位负责人）"
        where: 评估说明第二部分
        question_group: disclosure
        if_absent: { verdict: missing, severity: medium }
      - id: WP-ST-02
        workpaper_type: artifacts.detail_table
        expected: 说明中引用的明细与统计与评估明细表一致
        where: 评估明细表
        question_group: disclosure
        if_absent: { verdict: contradicted, severity: high }
