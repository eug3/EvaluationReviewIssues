# ============================================================
# 报告命题类型 (Claim Types)
#
# ReportClaim 的受控分类。抽取阶段按此归类，追问阶段据此选择问题组。
#
# 抽取原则：
#   1. 原子性：一句话只承载一个可判定命题
#   2. 可定位：必须能回到报告原文的章节/句子（chunk + positions）
#   3. 可判定：存在明确的底稿证据形态可以支持或否定它
#   4. 数值命题必须带 value / unit / currency
#
# question_groups 的值对应 questions/review_checklist.yaml 中的 group id。
# ============================================================

version: 1

claim_types:

  - id: object_scope
    name: 评估对象与范围
    description: 评估对象、评估范围、资产类型与数量、账面无记录/表外资产
    detect_hints: ["评估对象", "评估范围", "纳入评估范围", "表外资产", "账面未记录"]
    value_fields: []
    examples:
      - "评估对象为南京七伙科技合伙企业（有限合伙）股东全部权益"
      - "评估范围包括全部资产及负债"
    question_groups: [object_scope]

  - id: value_type
    name: 价值类型
    description: 报告采用的价值类型及其定义（市场价值/投资价值/在用价值/清算价值等）
    detect_hints: ["价值类型", "市场价值", "投资价值", "在用价值", "清算价值", "残余价值"]
    value_fields: []
    examples:
      - "本次评估的价值类型为市场价值"
    question_groups: [value_type]

  - id: base_date
    name: 评估基准日
    description: 评估基准日的日期、选取理由及期后事项处理
    detect_hints: ["评估基准日", "基准日"]
    value_fields: ["date"]
    examples:
      - "评估基准日为 2021 年 6 月 30 日"
    question_groups: [base_date]

  - id: purpose
    name: 评估目的与委托人
    description: 评估目的、委托人、报告使用人及经济行为
    detect_hints: ["评估目的", "委托人", "报告使用人", "经济行为", "拟受让"]
    value_fields: []
    examples:
      - "评估目的为南京紫金新兴产业创业投资基金有限公司拟受让股权"
    question_groups: [purpose]

  - id: method
    name: 评估方法与适用性
    description: 采用的评估方法、方法选择理由、未采用其他方法的说明
    detect_hints: ["评估方法", "收益法", "市场法", "成本法", "资产基础法", "采用", "不适用"]
    value_fields: []
    examples:
      - "本次评估采用收益法"
      - "资产基础法不适用"
    question_groups: [method]

  - id: parameter
    name: 评估参数
    description: 关键参数取值（折现率、增长率、资本化率、成新率等）及取值依据
    detect_hints: ["折现率", "增长率", "资本化率", "成新率", "WACC", "加权平均资本成本", "取"]
    value_fields: ["value", "unit"]
    examples:
      - "折现率取 10.5%"
      - "长期增长率为 3%"
    question_groups: [parameter]

  - id: calculation
    name: 计算过程与公式
    description: 从参数到结论的计算步骤、公式、口径与勾稽关系
    detect_hints: ["计算公式", "计算过程", "=∑", "折现", "现值", "口径"]
    value_fields: ["formula", "value", "unit"]
    examples:
      - "评估值 = 预测期现金流现值 + 永续期现值"
    question_groups: [calculation]

  - id: conclusion
    name: 评估结论与金额
    description: 评估结论、评估值（含大小写）、增减值、增值率
    detect_hints: ["评估结论", "评估值", "评估结果为", "增减值", "增值率", "大写"]
    value_fields: ["value", "unit", "currency"]
    examples:
      - "股东全部权益评估值为 12,345.67 万元"
      - "评估增值 2,345.67 万元，增值率 23.45%"
    question_groups: [conclusion]

  - id: change_analysis
    name: 评估值与账面值变动分析
    description: 评估值与账面值的比较、变动原因及合理性说明
    detect_hints: ["账面价值", "评估价值", "变动原因", "增值原因", "比较变动"]
    value_fields: ["value", "unit"]
    examples:
      - "评估增值主要来源于无形资产评估增值"
    question_groups: [change_analysis]

  - id: assumption
    name: 评估假设与前提
    description: 一般假设、特别假设、预测前提、市场条件假设
    detect_hints: ["评估假设", "假设", "前提", "持续经营", "公开市场"]
    value_fields: []
    examples:
      - "假设被评估单位持续经营"
    question_groups: [assumption]

  - id: limitation
    name: 限制条件与特别事项
    description: 报告使用限制、特别事项说明、不确定性与风险提示
    detect_hints: ["特别事项", "限制条件", "使用限制", "风险提示", "不确定性", "本报告仅供"]
    value_fields: []
    examples:
      - "本报告仅供相关监管机构和部门使用"
    question_groups: [limitation]

  - id: disclosure
    name: 披露一致性与核对字段
    description: 报告摘要、报告结论、说明结论、汇总表之间应当一致的关键字段
    detect_hints: ["摘要", "结论", "汇总表", "一致"]
    value_fields: ["field", "value"]
    examples:
      - "报告摘要与结论的评估对象、基准日、金额一致"
    question_groups: [disclosure]

  - id: legal_basis
    name: 评估依据与权属
    description: 引用的法律法规/准则、权属资料、经济行为文件
    detect_hints: ["评估依据", "法律法规", "权属", "不动产权证", "营业执照", "依据"]
    value_fields: []
    examples:
      - "评估依据包括《资产评估基本准则》及不动产权证"
    question_groups: [legal_basis]
