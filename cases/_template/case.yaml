# ============================================================
# 案例清单模板 (Case Manifest)
#
# 复制本目录到 cases/<case>/case.yaml 后填写。
# 输入统一来自 RAGFlow：用 dataset_ids + document_ids 区分「报告」与「底稿」。
# 检索接口：MCP evaluation-review 的 ragflow_retrieval。
# ============================================================

version: 1

case_id: "REPLACE-项目编号"
name: "REPLACE-案例名称"
valuation_base_date: "YYYY-MM-DD"

ragflow:
  # 本案例（报告 + 底稿）所在数据集
  dataset_ids:
    - "REPLACE-案例数据集ID"

  # 文档角色映射：document_name 必须与 RAGFlow 中的文件名一致或为其子串
  documents:
    report:
      role: report
      document_names:
        - "REPLACE-资产评估报告"
    statement:
      role: statement
      document_names:
        - "REPLACE-资产评估说明"
    working_papers:
      role: working_paper
      document_names:
        - "REPLACE-评估明细表"
        - "REPLACE-计算表"
    attachments:
      role: attachment
      document_names: []

  # 报告命题抽取用的章节探针问题（RAGFlow 只有检索接口，无法取全量）
  # 目标：把报告各章节的 chunk 召回回来，再交给 LLM 抽命题。
  report_probe_questions:
    - "评估对象 评估范围 资产类型 数量"
    - "评估目的 委托人 报告使用人 经济行为"
    - "价值类型 市场价值 定义"
    - "评估基准日 基准日选取"
    - "评估依据 法律法规 权属资料"
    - "评估方法 收益法 市场法 成本法 适用性"
    - "评估程序 实施过程"
    - "评估假设 前提条件"
    - "评估结论 评估值 增减值 增值率 大写"
    - "特别事项说明 使用限制"

  # 底稿取证时使用；不含 report 文档，避免用报告证明报告
  evidence_document_roles: [statement, working_papers, attachments]

retrieval_defaults:
  page_size: 20
  page: 1
  similarity_threshold: 0.2
  vector_similarity_weight: 0.3
  keyword: true

# 准则依据检索（给追问补「应当问什么/依据哪条准则」）
grounding:
  dataset_ids:
    - "d6edbed44e7a11f18ee0afe6a78982c3"   # 评估法及准则
  enabled: true

# 问题集：通用集 + 案例特化
questions:
  checklist: "questions/review_checklist.yaml"
  generated: "cases/REPLACE-项目编号/generated.yaml"

# 可选：Excel 确定性核验（S3b 增强）
excel_enhancement:
  enabled: false
  file: "REPLACE-计算底稿.xlsx"

output:
  dir: "cases/REPLACE-项目编号/out"
  neo4j_database: "kg-REPLACE-项目编号"
  formats: [jsonl, mermaid, matrix, issues]
