- subject: 固定资产-房屋建筑物/构筑物
  index: C4-6-1
  step_count: 19
  variant_count: 2
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1C成本法/房屋成本法计算表2019年2季度.xls
  steps:
  - 了解评估范围、评估目的，明确价值定义,辅导企业填写房地产评估申报明细表
  - 获取固定资产—房屋/构筑物评估申报表与明细账、总账、报表进行核对，账目与资产不相符时，根据评估需要进行相应的调整
  - 搜集房地产权证等权属资料，查阅与收集总平面布置图、施工图等建筑图纸、工程决算书、土地出让合同、动拆迁补偿合同等相关资料。
  - 对尚未领取房地产权证的应收集购房合同、规划许可证、建设许可证和企业出具的未领证说明等资料。
  - 根据权属资料，核对申报表上每项明细的权证号、竣工年代、位置、结构、面积等。如不符，修改。
  - 实地查勘房地产（主要是位置、周围环境、外观、建筑结构、装修、设备等状况, 有无拆除、报废、盘亏、盘盈、闲置建筑物, 关注建筑物生产使用环境[如蒸汽、酸、碱]），填写现场勘查表，并确定房屋成新率。现场查看时应拍摄现场实物照片。
  - 根据现场勘察资料，核对申报表上每项房屋／构筑物的竣工年代、位置、结构、面积等。如不符，修改。
  - 权证证明不符的，或者无权属证明的，应要求企业及相关单位出具说明。
  - 了解房地产有无涉讼事项及抵押、担保、出租等事宜，如有，应当查明原因并收集相关合同，并在报告中揭示。
  - 收集市场法评估的交易案例,交易案例的现场勘察及主要状况描述
  - 收集成本法评估的计算依据资料（如当地定额、材料价格、建设规费文件等）
  - 收集收益法评估的市场租金案例,现场勘察及主要状况描述,租金预测
  - 评估方法选取的依据和理由（要对三种方法逐一分析）
  - 采用成本法的，确定重置成本和成新率（各相关贬值因素）的过程和结果
  - 采用市场法的，参照物与评估对象的可比性分析以及根据评估对象与参照物的差异进行必要调整的过程和结果
  - 采用收益法的，确定收益期限、预期收益和折现率等相关参数的过程和结果
  - 编写房屋/构筑物评估明细表
  - 编写建筑物评估说明(账面\状况\核实\方法\案例\特别说明事项\结果及增减值原因分析)
  - 需要报告中特别说明的事项。
- subject: 固定资产-机器设备
  index: C4-6-4
  step_count: 15
  variant_count: 2
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/设备类/设备类底稿（2018）（一季度修订）.xls
  steps:
  - 获取固定资产—设备申报表,与明细账、总账、报表进行核对。
  - 了解固定资产设备类的概况，并按照机器、电子、运输设备分别以ABC原则进行分类统计。
  - 查验主要设备进口合同、购买发票、技术指标介绍等资料。
  - 对运输设备应当查阅车辆行驶证；对锅炉、电梯、化工设备等特种设备应当查阅年检记录。
  - 权证或证明文件名称不符的，应要求企业及相关单位出具说明。
  - 查清设备有无涉及诉讼事项及抵押、担保事宜，如有，应当查明原因，并在报告中揭示。
  - 分类实地查勘评估对象（主要是存放地点、型号、厂家、修理情况、使用情况、主要经济技术指标等），填写设备作业表。现场查看时，对于重大评估项目应拍摄现场实物照片。
  - 对原打包入帐的设备，尽可能进行分项评估。
  - 如存在待处理的情形，应查明原因，获得企业有关说明材料及批准文件。
  - 如存在需要修复使用的设备，应说明损坏的具体情况，并测算修复费用。
  - 收集评估值确定的询价证据及其他依据资料。
  - 选定评估方法，逐项或分类说明评估值的确定过程。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
