  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/32其他权益工具投资/c4-5其他权益工具投资1.29.xls
  steps:
  - 获取其他权益工具投资申报表,与明细账、总账、报表进行核对。
  - 按照不同类型的其他权益工具投资，清查、核实其他权益工具投资的实际持有数量及比例。查明投资形成日期、原始投资成本，溢价、折价、约定利息等，复印重要凭证资料。
  - 检查其他权益工具投资的购入、买卖记录，交易是否符合的规定，了解变现可能性。
  - 如有非记账本位币的投资，必要时查询并按评估基准日汇率折算。
  - 核实是否存在投资损失，并查明损失原因，获得企业说明材料及批准文件。
  - 选择适当的评估方法确定评估值。
  - 收集确定评估值的其他资料。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
- subject: 投资性房地产
  index: C4-5-1
  step_count: 17
  variant_count: 1
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  steps:
  - 获取投资性房地产评估申报表与明细账、总账、报表进行核对，账目与资产不相符时，根据评估需要进行相应的调整。
  - 了解投资性房地产的概况。
  - 搜集房地产权证、购房合同、租赁合同或其他权属证明资料。
  - 根据权属资料，核对申报表上每项房地产的权证号、竣工年代、结构、面积、用途等。如不符，修改。
  - 实地查勘评估对象（主要是坐落位置、周围环境、外观、建筑结构、装修、设备等状况, 用途及基准日的租约情况, 周边类似房地产的售价及客观租金情况等，填写现场勘查表，并确定房屋成新率。现场查看时应拍摄现场实物照片；采用市场法和收益法评估的案例资料和实际状况。
  - 根据现场勘察资料，与委托方沟通账面值内涵（了解是否含土地出让金、领证过程中应缴纳的相关税费）；租金内涵（是否含水电、物业、付款方式等），了解市场交易价的内涵（是净得价还是各自付税？）和租金内涵。
  - 权证证明不符的，或无权属证明的，应要求企业及相关单位出具其他相关的权属证明材料或有关权属方面的承诺。
  - 了解房地产有无涉讼事项及抵押、担保、出租等事宜，如有，应当查明原因并收集相关合同，并在报告中揭示。
  - 收集市场法评估的交易案例,交易案例的现场勘察及主要状况描述。注意评估值内涵与可比案例之间的比较必须建立在价值内涵一致的基础上。
  - 收集收益法评估的市场租金案例,现场勘察及主要状况描述,租金预测要建立在与市场租金价值内涵一致的基础上，且注意到不同支付方式对评估结论的影响。
  - 根据资料取得的情况选择评估方法，并注意到投资性房地产一般不适用成本法评估。
  - 采用市场法的，对参照物与评估对象的可比性分析以及根据评估对象与参照物的差异进行必要调整，计算得出评估值。
  - 采用收益法的，反映选取收益模型、净收益、收益期限和折现率等相关参数的过程和结果
  - 编写投资性房地产评估明细表，并检查明细表与计算底稿的勾稽关系；
  - 编写投资性房地产评估说明(账面\状况\核实\方法\案例\特别说明事项\结果及增减值原因分析)
  - 提交给项目负责人归档（非自我签字项目）或自行归档。
  - 本表供房地产评估人员现场清查时复核人员检查评估人员是否履行了必要的评估步骤。
