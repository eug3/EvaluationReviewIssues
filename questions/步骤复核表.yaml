  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/17委托加工物资/c3-11-4委托加工物资.xls
  steps:
  - 获取委托加工物资申报表,与检查明细账、总账、报表进行核对
  - 了解分析委托加工物资内部控制管理制度，会计核算方法，委托加工物资加工后是否可直接出售，并抽查有关委托加工物资出入库记录，期末余额有关的委托加工合同，做好相应清查记录。
  - 对错账、漏账、影响净资产的未达账项、贷方余额等项目进行分析，并复印有关资料
  - 对委托加工物资进行函证，对已收回的委托加工物资入库单进行查证，核对委托加工合同，委托加工是否正常。
  - 对长期未能收回的委托加工物资的原因进行了解，根据情况进行调整，盘盈、盘亏的存货，查明原因并作记录。
  - 对失效、变质等待核销报废的委托加工物资，应要求企业首先作出相应处理与说明
  - 对正常委托加工物资，根据加工后是否可以直接销售，采用不同方法，计算其评估价值；对委托加工物资加工后继续使用的存货，按照外购价确定评估单价，对于加工后直接出售的存货，按照产成品评估单价思路扣减加工费确定评估单价。
  - 对于特殊委托加工物资的结算方式，考虑结算条款进行评估。
  - 核实其他需要说明的事项
  - 如有评估增减值，分析评估增减值的原因
  - 有无需要报告中特别说明的事项
