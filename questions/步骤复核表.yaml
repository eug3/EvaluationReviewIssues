- subject: 委托加工物资
  index: C3-11-4
  step_count: 11
  variant_count: 1
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/A类项目/17委托加工物资/c3-11-4委托加工物资.xls
