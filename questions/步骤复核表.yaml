  - 对贷方余额做重分类调整
  - 对应收款项实施账龄分析以及其他分析程序，在《坏账分析表》中列示。
  - 选择重点明细项目（大额、有特殊情况、有疑问的，填写《往来函证单》实施函证等程序步骤，了解应收款项存在性。判断应收款项的可收回性。
