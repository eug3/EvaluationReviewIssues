  - 查阅大额应付款项发生的合同、协议等重要资料，并抽查有关会计凭证，做好相应清查记录。
  - 对借方余额做重分类调整
  - 选择重点明细项目实施函证，了解应付款项存在性。无法函证的，适当地实施替代程序，判断应付款项的真实性。
  - 分析判断企业应付款项有无无需支付项目，对应付款项中涉及法律诉讼的己决、未决事项、盈利挂账以及长期未付挂账项目等，作专项调查分析记录，涉讼事项还应当核查有无其他或有负债与债权。
