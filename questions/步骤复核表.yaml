- subject: 工程物资
  index: C4-10
  step_count: 13
  variant_count: 1
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/A类项目/37工程物资/c4-10工程物资.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/C类（或B类）项目/37工程物资/c4-10工程物资.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/37工程物资/c4-10工程物资.xls
  steps:
  - 获取工程物资申报表,与明细账、总账、报表进行核对。
  - 了解分析工程物资的构成、分布和核算方法。并抽查有关工程物资出入库记录，做好相应清查记录。
  - 对打包入账等项目尽可能进行分析，并复印有关资料。
  - 获取并检查被评估单位评估基准日的工程物资盘点记录，评价盘点的可信度。
  - 与企业管理人员选择重点工程物资进行抽盘，填写《盘点表》。盘点结果如与账面值存在差异，对差异原因不正常的，应加大抽盘力度。存放方式特殊的，应当采取可靠的盘点方式，并在工作底稿中记录下来。
  - 对盘盈、盘亏的工程物资，查明原因并作记录。
  - 应当注意有无未作账务处理而置于它处的工程物资。
  - 对失效、变质等工程物资，应要求企业作出相应说明。
  - 外购工程物资，进行市场询价，计算其评估价值。对近期购入的工程物资，无特殊情况且价格变化不大时，可按核实后的账面价值确定评估价值。
  - 根据上述情况，确定评估结论。跌价准备按照零值评估。应当注意有无与在建工程重复评估，并注意其权属问题、货款结算方式。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
