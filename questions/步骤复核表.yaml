  steps:
  - 获取银行存款申报表,与日记账、总账、报表进行核对。
  - 收集评估基准日“银行对账单”。检查会计人员编制的“银行存款余额调节表”,检查未达账项的真实性，并作好相关记录。
  - 评估时对银行基本账户、余额较大、零余额、透支的存款账户,必要时函证评估基准日余额，分析函证情况。
  - 对一年以上的定期存款或限定用途的存款，评估时关注存款利息收入的结算情况。
  - 对外币账户，须查询评估基准日汇率进行折算。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
