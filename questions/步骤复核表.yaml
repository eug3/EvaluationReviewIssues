  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/C类（或B类）项目/39生产性生物资产/c4-12生产性生物资产.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/39生产性生物资产/c4-12生产性生物资产.xls
  steps:
  - 获取生产性生物资产申报表,与明细账、总账、报表进行核对。
  - 搜集资产转让合同、林权证，了解资产范围和权属性质。了解有无涉讼事项及抵押、担保、出租等事宜，如有，应当查明原因并收集相关合同，并在报告中揭示。搜集林权证
  - 核对账面价值是否完整真实，对购入的生产性生物资产，核对出让合同、付款情况、发票、规划许可证和企业出具的未领证说明等资料。
  - 搜集基准日附近的林业勘查报告，
  - 实地查勘评估对象（主要是区域位置、交通、环境、基础设施、公共配套、生产经营等状况），根据资产申报表进行现场核对，与林权证、林勘报告核对，填写现场勘查表。现场查看时应拍摄现场实物照片。
  - 根据现场勘察资料，核对申报表信息。如不符，修改。
  - 与权证不符的，应要求企业出具说明，相关单位出具证明。
  - 搜集森林资源的相关法律、法规、政策，行业、企业、被评估资产生产经营指标，充分考虑森林资源林分质量、地利等级、自然生长力对森林资源价值的重大差异。
  - 了解森林资源资产市场的活跃程度，可比森林资源资产交易数据的可能性及其可靠性；
  - 选定评估方法。
  - 逐项说明评估参数的确定依据。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 需在报告中特别说明的事项。
  - 我做过经济林，可是生产性生物资产范围太广了，仅以经济林为例。
- subject: 无形资产-土地使用权
  index: C4-12-1
  step_count: 18
  variant_count: 1
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/土地使用权/土地评估勘查表2019年2季度.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  steps:
  - 了解评估范围、评估目的，明确价值定义,辅导企业填写土地使用权评估明细表
  - 获取土地使用权评估申报表与明细账、总账、报表进行核对，账目与资产不相符时，根据评估需要进行相应的调整
  - 搜集土地出让合同（动拆迁补偿合同、土地征用合同）、土地使用权证，了解土地使用权权属性质。了解房地产有无涉讼事项及抵押、担保、出租等事宜，如有，应当查明原因并收集相关合同，并在报告中揭示。
  - 对尚未领取土地使用权证的应收集土地出让合同、交纳土地出让金发票、规划许可证和企业出具的未领证说明等资料。
  - 根据权属资料，核对申报表上每项土地使用权的权证号、位置、取得日期、用途、性质、准用年限、开发程度、面积等。如不符，修改。
  - 实地查勘评估对象（主要是区域位置、交通、环境、基础设施、公共配套、宗地开发利用等状况,，填写现场勘查表。现场查看时应拍摄现场实物照片。
  - 根据现场勘察资料，核对申报表信息。如不符，修改。
  - 权证证明不符的，或者无权属证明的，应要求企业及相关单位出具说明。
  - 收集基准地价修正系数法评估的资料,现场勘察及主要状况描述,确定各因素的等级
  - 收集市场法评估的交易案例,交易案例的现场勘察及主要状况描述
  - 收集成本法评估的计算依据资料（如当地征地补偿费用标准、税费文件等）
  - 收集假设开发法评估的计算依据资料（如规划指标、房价信息、成本指标、税费文件等）
  - 收集收益法评估的市场租金案例,现场勘察及主要状况描述,租金预测
  - 评估方法选取的依据和理由（要对几种方法逐一分析）
  - 选定评估方法，通过编制计算表反映计算过程和确定评估结果
  - 编写土地使用权评估明细表
  - 编写土地使用权评估说明(账面\状况\核实\方法\案例\特别说明事项\结果及增减值原因分析)
  - 需要报告中特别说明的事项。
