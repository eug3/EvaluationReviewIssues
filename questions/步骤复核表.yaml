  steps:
  - 获取合同资产申报表,与明细账、总账、报表进行核对
  - 了解企业合同资产内控制度与核算方法，收集大额应收款项发生的合同、协议等重要资料，并抽查有关会计凭证，做好相应清查记录
  - 对贷方余额做重分类调整
  - 对应收款项实施账龄分析以及其他分析程序，如有坏账，在“坏账分析表”中列示
  - 选择重点明细项目（大额、有特殊情况、有疑问的，填写《企业往来询证函》实施函证等程序步骤，了解应收款项存在性。判断应收款项的可收回性
  - 分析判断企业应收款项的坏账及预计坏账损失，收集相关证据。
  - 有无非记账本位币账户，如有应查询评估基准日汇率进行折算，评估值按照本位币确定
  - 以核实调整后的余额扣除确定的坏账和预计坏账损失进行评估，确定评估结论
  - 对有确凿依据为坏账的款项，查明具体原因并取证，可评估为零
  - 核实其他需要说明的事项
  - 如有评估增减值，分析评估增减值的原因
  - 有无需要报告中特别说明的事项
