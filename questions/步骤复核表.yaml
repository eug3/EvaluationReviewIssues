- subject: 油气资产
  index: C4-13
  step_count: 11
  variant_count: 2
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/A类项目/40油气资产/c4-13油气资产.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/C类（或B类）项目/40油气资产/c4-13油气资产.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/40油气资产/c4-13油气资产.xls
  steps:
  - 获取申报表、科目明细及余额表、检查明细账、总账、报表进行三者相符核对。
  - 了解分析油气资产的构成、分布和企业内部控制管理制度、核算方法。并抽查有关油气资产出入库记录，做好相应清查记录。
  - 进行现场查看，填写现场查看表，与企业管理人员选择重点油气资产进行抽盘，填写《盘点表》，盘点结果如与账面值存在差异，对于差异原因不正常的，应加大抽盘项目或全面盘点。对盘盈、盘亏的油气资产，查明原因并作记录，调整实际数量和账面价值。存放方式特殊的，应当采取可靠的盘点方式，并在工作底稿中记录下来。
  - 收集适用定额封皮复印件及关于实施工程定额的政府文件复印件(一般在工程定额本的第2—3页)；工程其他费用定额复印件；当地造价信息类资料。
  - 外购资产合同、发票；主要建筑物工程预决算资料或图纸。
  - 收集相关矿区权益资料、相关许可使用资料、相关批准资料等
  - 应当注意有无未作账务处理而置于他处的油气资产。
  - 对失效、变质等待核销报废的油气资产，应要求企业首先作出相应处理与说明。
  - 案例评估值确定记录及作价表；非案例评估值确定记录及作价过程。
  - 如有评估增减值，分析评估增减值的原因。
