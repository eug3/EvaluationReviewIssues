  - 核实每一个租赁合同中有关租赁期、租赁付款额包含的内容、支付方式等内容，并与使用权资产进行核对。收集利率、折现率的计算资料。
  - 核实租赁负债的初始计量中固定付款额及实质固定付款额、取决于指数或比率的可变租赁付款额、购买选择权的行权价格、行使终止租赁选择权需支付的款项、承租人提供的担保余值中预计应付的款项的准确性。
  - 核实租赁负债中每期支付的租赁付款额、摊销的未确认融资费用的准确性
  - 核实是否存在租赁变更情形及其对租赁负债价值的影响
  - 如有评估增减值，分析评估增减值的原因
  - 有无需要报告中特别说明的事项
