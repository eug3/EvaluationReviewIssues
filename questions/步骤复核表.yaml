  steps:
  - 获取存货申报表,与检查明细账、总账、报表进行核对。
  - 了解分析存货的构成、分布和企业内部控制管理制度，各类存货的核算方法。并抽查有关存货出入库记录，做好相应清查记录。
  - 对错账、漏账、影响净资产的未达账项、贷方余额等项目进行分析，并复印有关资料。
  - 获取并检查被评估单位评估基准日或最近一次存货盘点记录，评价盘点的可信度。
  - 抽查盘点重点存货，填写《盘点表》。盘点结果如有差异，必要时加大盘点比例或全面盘点。存放方式特殊的或存放在异地的，采取其他程序确定存货的存在性。
  - 对盘盈、盘亏的存货，查明原因并作记录。
  - 关注有无代他人保存和来料加工的存货，有无未作账务处理而置于异地的存货。
  - 对失效、变质等待核销报废的存货，应要求企业首先作出相应处理与说明。
  - 对正常外购存货，实施市场询价，计算其评估价值。
  - 选择适当的存货评估方法，分别评估。
  - 对特殊行业存货，应聘请有关专家进行咨询后确定评估值。对委托加工产品与受托加工产品、委托代销商品与受托代销商品，评估值的确定应当考虑结算方式的差异性。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
