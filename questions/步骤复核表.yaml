- subject: 企业价值评估现金流量折现法(DCF)计算及
  index: SY1
  step_count: 23
  variant_count: 1
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/4收益法/企业自由现金流量折现法(DCF)/1@收益法底稿（空表，非整年度）V5.2.xlsx
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/4收益法/企业自由现金流量折现法(DCF)/2@收益法底稿（空表，整年度）V5.2.xlsx
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/4收益法/企业自由现金流量折现法(DCF)/示例/1@收益法底稿（示例，非整年度）V5.2.xlsx
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/4收益法/企业自由现金流量折现法(DCF)/示例/2@收益法底稿（示例，整年度）V5.2.xlsx
  steps:
  - 取得被评估企业前3~5年和本期审计报告、会计报表、科目明细表，以及相关收入、成本、费用等统计资料
  - 取得企业资产、财务、经营状况资料，着重了解经营活动涉及的范围，收入、收益结构，资产配置情况，在此基础上区分企业经营活动和经营活动之外的其他活动涉及相关资产、负债、损益等。布置企业填报资产基础法申报表、收益预测申报表，并在资产基础法的申报表上标识经营性资产（负债）与非经营性资产（负债）。以上资料由企业盖章或签字确认。
  - 根据评估业务的具体情况，在分析企业各科目明细的基础上，分析和调整被评估企业（1）财务报表编制基础；（2）非经常性收入和支出；（3）非经营性资产、负债和溢余资产及其相关的收入和支出。如涉及可比企业同理处理。
  - 区分经营活动与其他活动，并统计、分析：
  - 区分经营活动和其他活动，编制利润调整表
  - 计算经营最低保有现金，测算溢余现金
  - 区分经营活动和其他活动编制资产负债调整表
  - 根据调整后的资产负债表、利润表，分析历史财务指标。
  - 正确识别被评估企业所属行业，审慎选择参考上市公司，并统计相关财务指标
  - 根据历史统计数据、财务指标、参考上市公司平均财务指标、宏观经济状况、行业经济状况、企业发展状况等，调整企业预测的经营活动营业收入、营业成本、税金及附加、销售费用、管理费用等利润表项目
  - 预测营运资金及其净变动；
  - 根据历史情况，选择恰当的融资政策、现有借款合同等预测付息债务及利息费用，以及债务资本成本
  - 编制收益预测表。
  - 根据收益预测表，编制自由现金流量测算表。
  - 计算折现率涉及的(Ke、Kd、WACC)等参数
  - 采用现金流量折现法对债务融资现金流量进行折现，计算付息债务市场价值
  - 计算企业经营资产价值
  - 选用恰当的评估方法，计算其他活动涉及的资产、负债价值，计算子公司少数股东权益价值
  - 计算企业整体价值，股东全部权益价值
  - 如涉及股东部分权益价值，恰当考虑股权流动性折扣、控制权的溢折价等并计算之。
  - 检查收益法的逻辑计算过程及分析评估结果的合理性
  - 以计算表为基础，编写收益法评估说明
  - 撰写本项目中需要特别关注的事项和需要披露的特别事项。
