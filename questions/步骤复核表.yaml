  - 核实借款合同、协议以及借款条件、借款性质、还款期限，查明借款利率和利息支付情况。
  - 抽查借款借入和还款的原始凭证内容是否完整，有无授权批准，并核对相关账户的进出情况。
  - 复核已计借款利息是否正确，如有未记利息应作出记录，补记入账。
  - 对未及时归还的逾期借款，应查明原因。
  - 选择金额较大的账户向借款银行函证评估基准日的余额。
  - 对替其他单位借贷的款项，应查明原因。
  - 检查借款费用是否按各发生的期间，分别计入不同费用的科目。
