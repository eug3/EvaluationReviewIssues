- subject: 其他应收款
  index: C3-10
  step_count: 12
  variant_count: 2
  sources:
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/房屋建筑物/C4-8-1Y收益法/收益法评估计算表2019年2季度.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/A类项目/14其他应收款/c3-10其他应收款（A类项目）.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/C类（或B类）项目/14其他应收款/c3-10其他应收款（C类项目）.xls
  - 华信电子底稿编制指引（征求意见稿）/附件2：评【2025】-000 电子底稿/2操作类底稿/3资产基础法/财务类/划分经营性、非经营性资产、负债/14其他应收款/c3-10其他应收款（A类项目）.xls
  steps:
  - 获取其他应收款申报表,与明细账、总账、报表进行核对。
  - 了解分析其他应收款中款项用途，收集大额其他应收款发生的合同、协议等重要资料，并抽查有关会计凭证，做好相应清查记录。
  - 对贷方余额做重分类调整
  - 对其他应收款实施账龄分析以及其他分析程序，在《坏账分析表》中列示。
  - 选择重点明细项目（大额、有特殊情况、有疑问的，填写《往来函证单》实施函证，了解应收款项存在性。施替代程序，判断应收款项的可收回性。
  - 分析判断企业其他应收款的坏账及预计坏账损失，收集相关证据
  - 对有确凿依据为坏账的款项 ，查明具体原因并取证，可评估为0
  - 有无非记账本位币账户，如有应查询评估基准日汇率的中间价，评估值按照本位币确定。
  - 以核实调整后的余额扣除确定的坏账和预计坏账损失进行评估，确定评估结论。
  - 核实其他需要说明的事项。
  - 如有评估增减值，分析评估增减值的原因。
  - 有无需要报告中特别说明的事项。
