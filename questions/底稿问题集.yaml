    procedure: P4
  - id: Q-NF-004
    ask: 评估计算表、询价资料是否由相关评估人员在签字表对应栏目签字确认？
    procedure: P8
  - id: Q-NF-005
    ask: 设备类是否分列机器设备（C4-8-4）、车辆（C4-8-5）、电子设备（C4-8-6）？是否含勘查照片、权属电子版、合同发票电子版？
    procedure: P5
  - id: Q-NF-006
