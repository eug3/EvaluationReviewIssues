    procedure: P5
  - id: Q-NF-010
    ask: 投资性房地产、在建工程（土建/设备安装）是否按科目步骤执行并归档相应计算表？
    procedure: P6
- id: dcf
  name: 收益法（企业自由现金流量折现法 DCF）
  source: 指引 第四部分五 + DCF 底稿 17 张表 + 步骤复核表
  questions:
  - id: Q-DCF-001
    ask: 是否严格按收益法《评估步骤及复核表》执行相关评估程序？
    check: DCF 步骤见 questions/步骤复核表.yaml 的 SY1
    procedure: P8
  - id: Q-DCF-002
    ask: 收益法预测支撑材料是否齐全：企业经营计划/发展规划/预算、在手合同清单及复印件、生产成本分配表、生产产能、生产线介绍、行业情况分析、企业经营情况、资本性支出计划等？
    procedure: P5
  - id: Q-DCF-003
    ask: 是否关注在手订单的执行情况？
    procedure: P4
  - id: Q-DCF-004
    ask: 是否关注主要产品或原材料（尤其大宗商品）的价格波动情况？
    procedure: P5
  - id: Q-DCF-005
    ask: 预测期收入增长率与历史期差异较大时，是否分析说明差异较大的原因？
    procedure: P6
  - id: Q-DCF-006
    ask: 对新增业务的定价、销售量、毛利率的选取依据是否进行必要核查验证（市场供求、同类产品价格区间、毛利水平等），是否避免仅依赖被评估单位提供的预测数据？
    procedure: P6
  - id: Q-DCF-007
    ask: 对收入预测影响较大的《框架协议》是否通过询问、访谈、函证、核对等方式调查、核实项目真实性？是否关注项目承接是否需进一步招投标流程、招投标结果，分析以前年度中标率？
    procedure: P4
  - id: Q-DCF-008
    ask: 是否有一套完整的收益法计算表（1报表→2报表调整→3收入→4成本→5税金→6销管→7折旧→8摊销→9溢余现金→10营运→11财务费用→12收益表→13FCFF→14FCFE→预测财报）？
    procedure: P6
  - id: Q-DCF-009
    ask: 折现率计算：可比公司选择是否参照市场法可比公司选择的要求？
    procedure: P6
  - id: Q-DCF-010
    ask: 折现率计算：资本结构采用自身还是目标？是否符合企业常态化经营需求、是否可持续？是否关注异常可比公司资本结构、自身与目标资本结构差异过大且难以趋同？
    procedure: P6
  - id: Q-DCF-011
    ask: 折现率计算：所得税率如何确定？合并口径下母子公司税率不一致时，采用历史综合税率是否合理、是否与预测口径一致？税率差异较大时是否单独预测？
    procedure: P6
  - id: Q-DCF-012
    ask: 非经营性资产/负债、溢余资产是否识别并在收益法测算中单独处理？
    procedure: P6
  - id: Q-DCF-013
    ask: 收益法评估计算表等涉及签字的资料是否由相关评估人员在签字表对应栏目签字确认？
    procedure: P8
  - id: Q-DCF-014
    ask: 收益预测与历史业绩和现实经营状况存在重大差异时，是否在评估报告中披露并对差异原因及合理性作出说明？
    check: 《资产评估执业准则——企业价值》§23
    procedure: P7
  - id: Q-DCF-015
    ask: 折现率各参数（无风险利率、市场风险溢价、Beta、特定风险报酬率、债务成本）是否逐项注明取值来源，并在计算表中保留取值过程？
    check: T-VA-03（62条）：Q-DCF-009~011问方法与结构，本条问每个参数的来源留痕
    procedure: P6
  - id: Q-DCF-016
    ask: 收益预测是否有外部佐证（在手订单执行、历史预测实现率、行业增速对比）？直接采用委托人提供预测时是否分析验证其合理性？
    check: T-VA-04（49条）：处罚原文常见「直接采用委托人提供的经营预测资料……缺少必要的分析判断」
    procedure: P6
  - id: Q-DCF-017
    ask: 资本性支出预测与折旧摊销预测是否匹配衔接？是否考虑现有资产更新与新增产能的对应关系？
    check: T-VA-01：资本性支出与折旧口径脱节
    procedure: P6
  - id: Q-DCF-018
    ask: 期末（终值年）营运资金回收的处理是否正确，与各预测年营运资金测算口径是否一致？
    check: T-VA-08
    procedure: P6
  - id: Q-DCF-019
    ask: 以财务报告为目的（减值测试）的评估：现金流量预测口径与所测试资产/资产组范围是否一致？折现率与现金流口径（税前/税后）是否匹配？减值迹象明显时是否追加第二方法或第二测算印证？
    check: T-VA-08（60条）：减值测试要素处理错误
    procedure: P6
- id: market
  name: 市场法
  source: 指引 第四部分六
  questions:
  - id: Q-MK-001
    ask: 是否严格按市场法《评估步骤及复核表》执行相关评估程序？
    procedure: P8
  - id: Q-MK-002
    ask: 市场法所需资料是否收集齐全？
    procedure: P5
  - id: Q-MK-003
    ask: 可比公司时间要求：所选可比公司是否具有一定上市交易历史（通常不少于3年）？经历重组上市或重大重组的，是否在其重组后稳定运行至少3年？
    procedure: P6
  - id: Q-MK-004
    ask: 可比公司样本量：数量是否大于3家？细分行业不足3家时，是否从更广泛行业范围寻找以满足样本量要求？
    procedure: P6
  - id: Q-MK-005
    ask: 可比公司区域要求：营业地和上市所在地是否尽可能与被评估公司一致？美股、H股与内资企业是否避免直接比较？B股为主的上市公司是否尽量避免？
    procedure: P6
  - id: Q-MK-006
    ask: 可比公司是否避免选择停牌、ST、新三板挂牌公司（非完全流通，期后难以定量调整流动性折扣）？
    procedure: P6
  - id: Q-MK-007
    ask: 是否有一套完整的市场法计算表？
    procedure: P6
  - id: Q-MK-008
    ask: 评估计算表等涉及签字的资料是否由相关评估人员在签字表对应栏目签字确认？
    procedure: P8
  - id: Q-MK-009
    ask: 如涉及同花顺取数，电子底稿中是否保留一份断开链接的计算表？
    procedure: P8
  - id: Q-MK-010
    ask: 上市公司比较法、交易案例比较法是否分别归档且资料齐全？
    procedure: P8
  - id: Q-MK-011
    ask: 可比公司/交易案例的选取标准与筛选过程（初选池、逐家入选或剔除理由）是否在底稿中记录并披露？
    check: T-VA-06（72条）：可比对象不具可比性、选取过程未披露
    procedure: P6
  - id: Q-MK-012
    ask: 对可比公司价值比率是否作必要调整（成长性、盈利能力、规模、流动性等）？调整参数是否有来源？
    check: T-VA-06
    procedure: P6
- id: substance
  name: 评定估算实质留痕
  source: questions/处罚问题映射.yaml（2024年处罚监管数据脱敏映射）+ 资产评估执业准则（企业价值/资产评估程序）
  questions:
  - id: Q-SB-001
    ask: 重要参数（收入增长率、毛利率、费用率、资本性支出、营运资金、折现率各构成等）的取值来源（历史数据/行业数据/市场数据/企业预算）与分析判断过程是否在底稿中留痕？
    check: 2024处罚频次TOP1（T-VA-01，262条）：直接采用委托人提供的预测而缺少分析判断是最高频处罚点；《资产评估执业准则——企业价值》第23条
    procedure: P6
  - id: Q-SB-002
    ask: 选取（及未选取）每种评估方法的理由与适用性分析是否在底稿中记录？仅采用单一方法时是否论证了排除其他方法的理由？
    check: T-VA-02（78条）：方法选取不当或未论证适用性
    procedure: P6
  - id: Q-SB-003
    ask: 是否存在无评定估算过程、无评估计算底稿而直接形成评估结论的情形？
    check: 合规红线（T-VA-07，17条）：发现即升级单独处理，不作普通勾选项
    procedure: P6
  - id: Q-SB-004
    ask: 计算表内公式、参数口径与勾稽关系是否经复核：Beta计算逻辑与WACC口径是否一致？计算表中参数（周转率、单价、定额）是否有来源、与后续计算是否逻辑衔接？
    check: T-VA-09（78条）+T-VA-01：公式错误、口径不一致、参数无计算依据
    procedure: P6
  - id: Q-SB-005
    ask: 报告→底稿反向核对：报告、说明、明细表中的每个数值与结论能否在底稿中找到支撑，且与底稿计算结论双向一致？
    check: T-RP-02（6条）：Q-AR-018只查底稿→报告单向，本条补反向核对
    procedure: P7
  - id: Q-SB-006
    ask: 重置成本、成新率、造价、调价系数等成本法取值是否有依据与计算过程？定额与价格水平是否与评估对象所在区域、基准日匹配？
    check: T-VA-05（127条）：定额选取与所在区域不一致、成新率无依据是高频处罚点
    procedure: P6
  - id: Q-SB-007
    ask: 非经营性资产/负债、溢余资产、期末营运资金回收的处理是否与收益预测口径一致，有无重复计算或遗漏？
    check: T-VA-08（60条）：要素处理错误
    procedure: P6
- id: report-errors
  name: 评估报告及评估说明低级错误
  source: 评估报告及评估说明低级错误定义表（试行稿2012.9.4）
  questions:
  - id: Q-RE-001
    ask: 项目名称四要素是否齐全？
    check: 国有资产/上市公司项目：企业名称+经济行为+评估对象+评估报告；特殊要求应在评估计划中申报并尽早获得审核人员同意
    procedure: P7
  - id: Q-RE-002
    ask: 列示目录与后面章节实际目录是否相符（有无目录有内容没有、内容有目录没有、序号重复/跳序/错误）？
    procedure: P7
  - id: Q-RE-003
    ask: 是否存在错字、别字、多字、漏字？
    procedure: P7
  - id: Q-RE-004
    ask: 项目名称、委托方、产权持有单位、被评估单位名称是否表达一致且与所附营业执照一致？有无「本公司」误用？
    procedure: P7
  - id: Q-RE-005
    ask: 页眉、页脚是否正确（含页眉名称与项目名称是否一致）？
    procedure: P7
  - id: Q-RE-006
    ask: 目录页码与实际页码是否一致？
    procedure: P7
  - id: Q-RE-007
    ask: 有无明显时间差错：现场调查时间早于业务约定书签约时间、评估报告日早于经济行为依据出具时间等？
    procedure: P7
  - id: Q-RE-008
    ask: 评估报告、说明、明细表对同一问题是否一致（数值或性质）？各科目账面值/评估结论与明细表、说明是否一致？
    procedure: P7
  - id: Q-RE-009
    ask: 企业价值评估项目账面值与所附基准日审计报告或资产负债表是否一致？
    check: 有审计报告与审定数一致；无审计报告与基准日资产负债表一致
    procedure: P7
  - id: Q-RE-010
    ask: 评估基准日与业务约定书、明细表、评估说明中的基准日是否一致？
    procedure: P7
  - id: Q-RE-011
    ask: 报告格式是否符合准则或指南要求？是否包含对应准则必须披露的内容？章节内容和名称是否符合报告准则？
    check: 如不得把「评估程序实施过程和情况」写成「评估过程」
    procedure: P7
  - id: Q-RE-012
    ask: 报告签字人与评估明细表列示的签字人是否相符？
    procedure: P7
  - id: Q-RE-013
    ask: 评估报告中是否有注册资产评估师声明或承诺函？
    procedure: P7
  - id: Q-RE-014
    ask: 涉及国有资产评估的项目，报告附件是否有经济行为依据？
    check: 无法获得的须在送审时单独说明并获三级审核人员同意
    procedure: P7
  - id: Q-RE-015
    ask: 经济行为依据中的评估目的等表述与业务约定书中的评估目的是否存在矛盾？
    procedure: P7
  - id: Q-RE-016
    ask: 是否有评估对象的资产权属证明文件？
    check: 单项资产需权属证书（含他项权证）；股权项目需股权证明文件及不动产权属证书
    procedure: P7
  - id: Q-RE-017
    ask: 企业价值评估报告是否附评估基准日审计报告或财务报表？
    procedure: P7
  - id: Q-RE-018
    ask: 股权价值评估是否附长期投资单位的营业执照复印件或股权证明文件？
    procedure: P7
  - id: Q-RE-019
    ask: 是否附资产评估业务约定书？
    procedure: P7
  - id: Q-RE-020
    ask: 附件营业执照上的单位名称与报告中描述的单位名称是否完全一致？
    check: 重点核查近期更名的单位
    procedure: P7
  - id: Q-RE-021
    ask: 所附个人资质证书与报告、明细表列示的签字人是否一致？
    procedure: P7
  - id: Q-RE-022
    ask: 涉及国有资产或企业价值评估项目的评估说明中是否有资产清查章节？
    procedure: P7
  - id: Q-RE-023
    ask: 评估说明中是否有主要资产的评估案例？
    check: 主要资产一般包括存货、房屋及构筑物、管道沟槽、机器设备、车辆、土地、长期待摊费用（装潢）、生物性资产、无形资产等
    procedure: P7
  - id: Q-RE-024
    ask: 评估案例的序号、评估值与评估明细表中列示的序号、评估值是否一致？
    procedure: P7
  - id: Q-RE-025
    ask: 采用资产基础法评估股权价值时，各科目的评估说明是否齐全？
    check: 国有资产和上市公司项目应对各科目评估值的得出给出书面说明
    procedure: P7
  - id: Q-RE-026
    ask: 报告评估依据中引用的法规、准则是否齐全、现行有效？有无引用已废止准则或条款号错误？
    check: T-RP-01（41条）
    procedure: P7
  - id: Q-RE-027
    ask: 评估假设是否逐项披露，并与评估结论、参数取值存在支撑关系？
    check: T-RP-04（28条）：假设无依据、不合理或披露不齐
    procedure: P7
  - id: Q-RE-028
    ask: 特别事项、期后事项、权属瑕疵（抵押/查封/未办证等）是否在报告中披露并说明对评估结论的影响？
    check: T-RP-05（72条）
    procedure: P7
  - id: Q-RE-029
    ask: 评估结论有效期表述（自评估基准日起一年）与评估报告日是否合规？报告日是否不早于全部必需程序完成日？
    check: T-RP-06（23条）
    procedure: P7
  - id: Q-RE-030
    ask: 国有资产、司法、征收等特殊类别报告是否执行对应指南的附加要求（资产清查章节、特殊披露、备案格式等）？
    check: T-RP-07（56条）
    procedure: P7
- id: detail-errors
  name: 评估明细表低级错误
  source: 评估明细表低级错误定义表（试行稿2012.9.4）
  questions:
  - id: Q-DE-001
    ask: 表格格式是否符合指南要求？（如有调整后账面值、科目名称错误、有资产占有方等字样）
    procedure: P7
  - id: Q-DE-002
    ask: 是否有分类汇总表？（针对整体资产评估或股权/净资产评估）
    procedure: P7
  - id: Q-DE-003
    ask: 是否有表格编号？编号是否正确？
    procedure: P7
  - id: Q-DE-004
    ask: 表格名称是否正确？
    procedure: P7
  - id: Q-DE-005
    ask: 是否存在错字、别字？
    procedure: P7
  - id: Q-DE-006
    ask: 产权持有单位、被评估单位名称是否正确、有无空缺？
    procedure: P7
  - id: Q-DE-007
    ask: 页脚中申报单位填表人、填表日期及评估人员等是否有空缺？
    procedure: P7
  - id: Q-DE-008
    ask: 涉及国有资产和企业价值评估时，账面值与所附审计报告或财务报表是否一致？
    procedure: P7
  - id: Q-DE-009
    ask: 项目填列是否完整（有无缺项、漏填）？重要资产是否缺规格型号、生产厂家等？
    procedure: P7
  - id: Q-DE-010
    ask: 明细与汇总及各表之间的勾稽关系是否正确？
    procedure: P7
  - id: Q-DE-011
    ask: 评估值与评估说明中的案例数据是否一致？
    procedure: P7
  - id: Q-DE-012
    ask: 公式计算是否正确？
    check: 如数量×评估单价≠评估值、重置价×成新率≠评估值
    procedure: P7
  - id: Q-DE-013
    ask: 同单位、同样规格的存货评估单价不一致时是否备注说明？
    procedure: P7
  - id: Q-DE-014
    ask: 评估基准日与评估报告或评估说明中的基准日是否一致？
    procedure: P7
  - id: Q-DE-015
    ask: 评估值或增值率表达是否正确？
    check: 有账面值的评估值为0或空白应在备注栏说明，不能把0表达为空白
    procedure: P7
  - id: Q-DE-016
    ask: 明细表所列产权证明文件在附件中能否找到、文件号是否一致？
    check: 主要指不动产：房产证号与附件不一致或找不到
    procedure: P7
  - id: Q-DE-017
    ask: 同时间启用、同样规格的设备评估单价不一致时是否备注？
    procedure: P7
  - id: Q-DE-018
    ask: 同结构、同时建的建筑物评估单价不一致时是否备注？
    procedure: P7
  - id: Q-DE-019
    ask: 有无由错行、串列或数量错误造成的评估结论错误？
    procedure: P7
- id: archive
  name: 档案检查要点
  source: 江苏华信资产评估有限公司评估档案检查要点
  questions:
  - id: Q-AR-001
    ask: 档案中的基本资料是否齐全：档案目录、业务约定书复印件、项目完成时间安排表及（含技术方案）评估计划表、三级审核表及审核记录底稿、项目经理对各级审核的修改回复？
    procedure: P8
  - id: Q-AR-002
    ask: 是否有委托方或被评估单位签字盖章的资产评估申报表？
    procedure: P8
  - id: Q-AR-003
    ask: 是否有与评估对象相关的权属资料（提供方盖骑缝章）？
    procedure: P8
  - id: Q-AR-004
    ask: 是否有委托方及被评估单位提供的财务资料及与本次评估相关的其他资料（盖骑缝章）？
    procedure: P8
  - id: Q-AR-005
    ask: 是否有主要资产的市场询价资料？
    procedure: P8
  - id: Q-AR-006
    ask: 是否有操作类工作底稿（主要是评估值与账面值不一致科目的工作底稿）？
    procedure: P8
  - id: Q-AR-007
    ask: 股权价值评估涉及的企业访谈及评估重大问题的处理记录是否齐全？
    procedure: P8
  - id: Q-AR-008
    ask: 是否有可以证明评估师履行评估程序留痕的相关资料？
    procedure: P8
  - id: Q-AR-009
    ask: 档案装盒是否符合要求：第一盒含归档资料目录、管理类底稿、评估报告/说明/明细表正本，其后装报告备印件及其他工作底稿，其余按档案目录排列？
    procedure: P8
  - id: Q-AR-010
    ask: 底稿装订是否符合要求：封面—资料清单—按清单顺序装订的底稿—客户后期信息资料？母公司及子公司是否分开归集并按长期投资报告顺序号分别装订？
    procedure: P8
  - id: Q-AR-011
    ask: 报告、承诺函是否有两位资产评估师签字？
    procedure: P8
  - id: Q-AR-012
    ask: 业务约定书是否有法定代表人签字？
    procedure: P8
  - id: Q-AR-013
    ask: 评估工作计划是否有公司分管负责人签字？
    procedure: P8
  - id: Q-AR-014
    ask: 操作类底稿中是否有评估人和签字注册资产评估师的复核签字？
    procedure: P8
  - id: Q-AR-015
    ask: 是否在报告出具后三个月内归档？超期是否有部门提交的延期归档申请？
    procedure: P8
  - id: Q-AR-016
    ask: 历史高频问题自查：评估计划是否完备（尤其针对性技术方案）？
    procedure: P8
  - id: Q-AR-017
    ask: 历史高频问题自查：工作底稿是否缺失（尤其主要资产询价记录、与管理层访谈纪要）？
    procedure: P8
  - id: Q-AR-018
    ask: 历史高频问题自查：工作底稿或归档表格的计算结论与报告评估结论是否一致？
    procedure: P8
  - id: Q-AR-019
    ask: 历史高频问题自查：现场勘察记录和现场勘查照片是否缺失？询价记录是否缺失？
    procedure: P8
  - id: Q-AR-020
    ask: 历史高频问题自查：底稿是否有目录、索引？底稿之间是否具备勾稽关系？
    procedure: P8
  - id: Q-AR-021
    ask: 历史高频问题自查：委托方和被评估单位的申报评估明细表是否签字盖章？其他申报材料是否有骑缝章？
    procedure: P8
  - id: Q-AR-022
    ask: 历史高频问题自查：银行或客户往来询证函是否沿用了审计底稿而无评估人员参与程序或价值判断痕迹？
    procedure: P8
  - id: Q-AR-023
    ask: 历史高频问题自查：底稿是否区分管理类/操作类？操作类是否按资产类别及被评估单位主体装订？
    procedure: P8
  - id: Q-AR-024
    ask: 历史高频问题自查：委托方及相关当事方提供的申报评估范围与报告评估范围是否一致？
    procedure: P8
  - id: Q-AR-025
    ask: 历史高频问题自查：评估计划、项目风险等前期工作是否流于形式？管理底稿能否体现项目完整评估思路？
    procedure: P8
  - id: Q-AR-026
    ask: 历史高频问题自查：委托方提供的除申报表之外的其他资料是否盖章（可以是骑缝章）？
    procedure: P8
  - id: Q-AR-027
    ask: 历史高频问题自查：底稿是否有编号？编号是否统一、与程序（傻瓜）手册对应？
    procedure: P8
  - id: Q-AR-028
    ask: 初步评估报告（送审稿）是否随各级审核意见一并归档？
    check: T-AR-03（13条）：初步评估报告未归档
    procedure: P8
  - id: Q-AR-029
    ask: 正式评估报告、说明、明细表是否单独装订成册？
    check: T-AR-03
    procedure: P8
  - id: Q-AR-030
    ask: 归档目录是否注明文档介质形式（纸质/电子/其他介质）与归档时间？
    check: T-AR-01（19条）：《资产评估执业准则——资产评估档案》第6条
    procedure: P8
  - id: Q-AR-031
    ask: 底稿是否按评估对象类别/科目编制目录索引，可快速定位每份底稿？
    check: T-AR-01/T-AR-02
    procedure: P8
  - id: Q-AR-032
    ask: 档案是否有项目负责人（或档案保管责任人）签字确认？
    check: T-AR-01
    procedure: P8
  - id: Q-AR-033
    ask: 管理类+操作类底稿整体齐全性是否对照目录清单逐项自查？缺失项是否补齐或在底稿中记录原因？
    check: T-WP-01（39条）：底稿整体缺失、程序履行不充分
    procedure: P8
