version: 1
title: 华信电子底稿问题集
purpose: 把「整理/复核电子底稿」时要问的问题结构化：按底稿编制与送审环节、底稿类型分组，每条问题可逐项勾选。
sources:
- 华信电子底稿编制指引（征求意见稿）.docx
- 附件2 管理类底稿：资产评估项目归档管理类底稿（2023修订）.xlsx（含 档案检查要点、评估报告及评估说明低级错误定义表、评估明细表低级错误定义表）
- 附件2 操作类底稿：1操作类电子底稿目录.xlsm（含 送审表（勾选））
- 附件2 操作类底稿 各科目《评估步骤及复核表》
- questions/处罚问题映射.yaml（2024年处罚监管数据脱敏映射，负向清单依据；源文件保密不入库）
subject_steps_ref:
  file: questions/步骤复核表.yaml
  desc: 72 个科目、736 条操作步骤与要求，作为各科目逐项问题
procedure_legend:
  P1: 明确业务基本事项
  P2: 订立业务委托合同
  P3: 编制资产评估计划
  P4: 进行现场调查
  P5: 收集整理评估资料
  P6: 评定估算形成结论
  P7: 编制出具评估报告
  P8: 整理归集评估档案
  PX: 跨程序/形式规范
summary:
  groups: 12
  questions: 207
groups:
- id: send-review
  name: 送审前置要求
  source: 指引 第二部分 电子底稿送审基本要求
  questions:
  - id: Q-SR-001
    ask: 工作底稿编制是否符合《资产评估执业准则——资产评估档案》（中评协〔2018〕37号）？
    check: 合规性底线，逐条对照准则第5-14条
    procedure: P8
  - id: Q-SR-002
    ask: 底稿内容是否资料翔实、重点突出、繁简得当、结论明确？
    procedure: PX
  - id: Q-SR-003
    ask: 各科目是否严格按《评估步骤及复核表》执行评估程序，复核表是否经项目复核人签字确认后归档？
    procedure: P8
  - id: Q-SR-004
    ask: 基本组成是否齐全：资产评估报告、说明、明细表及电子工作底稿（管理类、操作类）？
    procedure: P8
  - id: Q-SR-005
    ask: 文件夹层级是否严格按公司规定结构（参照附件2）组织？各层级文件夹名称是否清晰、准确、明确反映内容？
    procedure: PX
  - id: Q-SR-006
    ask: 是否仅存放与本次评估直接相关且必要的底稿？无用/不相关底稿是否已剔除？未涉及的资产科目文件夹是否已删除？
    procedure: PX
  - id: Q-SR-007
    ask: 送审前是否完成实质性项目复核人审核与一级审核？
    check: 缺任一级实质性审核，二审直接退回补充
    procedure: P8
  - id: Q-SR-008
    ask: 是否使用「评估小助手」编制所有评估科目的核实表并标注索引号？实质性核验底稿文件名是否与核实表索引号一致？
    procedure: P8
  - id: Q-SR-009
    ask: 是否所有科目都有核实表？
    check: 缺核实表直接退回补充
    procedure: P8
  - id: Q-SR-010
    ask: 权证类资料是否在现场与原件核对，并在「评估人员签字表」标注“复印件与原件核对一致”、签名（签章）并注明核对日期？不一致是否查明原因并将说明纳入底稿？
    procedure: P4
  - id: Q-SR-011
    ask: 引用审计函证作为评估依据时，评估人员是否对原件复核，并在签字表注明“复印件与原件核对一致”并签字、标注日期？
    procedure: P4
  - id: Q-SR-012
    ask: 《电子文档盖章资料清单》是否已编制并加盖公章？
    procedure: P8
  - id: Q-SR-013
    ask: 需要单独加盖公章扫描的重要资料（申报表、盘点表、权证类、产权声明、资产盘亏说明、抵押担保等权属瑕疵说明等）项目经理是否已识别？
    procedure: P8
- id: management
  name: 管理类工作底稿（GL）
  source: 指引 第三部分 + 管理类底稿模板/档案检查要点
  questions:
  - id: Q-MG-001
    ask: 管理类底稿是否齐全：基本事项记录、业务风险及专业能力分析评价、独立执业声明、业务承接综合分析和评价、委托合同、评估计划、重大问题处理记录、三级审核表及意见、发文审批单？
    procedure: PX
  - id: Q-MG-002
    ask: GL-1《评估业务基本事项表》是否填写完整（委托人/产权持有人/其他报告使用人/评估目的/对象/范围/价值类型/基准日/报告使用范围/提交期限/收费/配合事项）？
    procedure: P1
  - id: Q-MG-003
    ask: GL-2《业务风险及专业能力分析和评价表》是否逐项评价并填写备注？
    procedure: P1
  - id: Q-MG-004
    ask: GL-3《评估专业人员独立执业声明书》是否按整体/单项分别签署？
    procedure: P1
  - id: Q-MG-005
    ask: GL-4《聘请专家个人及专业机构申请表》在利用专家工作时是否填写并经审批？
    procedure: P1
  - id: Q-MG-006
    ask: GL-5《评估业务承接综合分析和评价表》是否覆盖专业能力、业务风险、独立性、利用专家工作四项？
    procedure: P1
  - id: Q-MG-007
    ask: GL-6《评估项目工作计划表》是否包含针对性评估技术方案？复杂项目技术方案是否在三审后附于本表之后？
    procedure: P3
  - id: Q-MG-008
    ask: GL-7《评估报告三级审核表》及各级审核记录是否齐全？各级审核意见是否有实质性内容（指出具体问题与修改要求，而非仅签名走流程）？项目审核人员与报告签名人员是否由不同评估师担任？
    check: T-AR-04（60条）：三级复核流于形式、无实质性内容是高频处罚点
    procedure: P8
  - id: Q-MG-009
    ask: 项目经理对各级审核意见是否逐条修改回复并留痕（意见—修改—复核闭环）？
    procedure: P8
  - id: Q-MG-010
    ask: GL-8《发文审批单》是否按钉钉打印（不用签字）并归档？
    procedure: P7
  - id: Q-MG-011
    ask: GL-9《客户签收单》是否填写齐全（报告、明细表等份数）？
    procedure: P7
  - id: Q-MG-012
    ask: GL-10《委托人或国资管理部门意见反馈表》及针对反馈意见的回复是否齐全？
    procedure: P7
  - id: Q-MG-013
    ask: 《评估过程中重大问题处理记录》（GL-6）是否齐全（提请研究的主要问题/处理意见/请示人/批示人及日期）？
    procedure: PX
  - id: Q-MG-014
    ask: 类似质控会讨论的问题记录（GL-6 提交质量控制委员会讨论的问题）是否齐全（如涉及）？
    procedure: PX
  - id: Q-MG-015
    ask: 委托合同是否有效订立并归档？业务约定书是否有法定代表人签字？
    procedure: P2
- id: general
  name: 操作类-综合类电子底稿（CZ）
  source: 指引 第四部分一 + 送审表/操作类电子底稿目录
  questions:
  - id: Q-CZ-001
    ask: 所有评估申报表科目是否打印后加盖相关单位公章？是否鼓励将申报明细表扫描归入电子底稿？
    procedure: P5
  - id: Q-CZ-002
    ask: 访谈记录是否经被访谈人签字确认或由被评估单位加盖公章？单项评估是否需要？
    procedure: P5
  - id: Q-CZ-003
    ask: 历史沿革类资料（批复、决议、章程、营业执照变更记录、验资报告、股权转让协议等）是否加盖公章后的扫描件？是否严禁直接使用 Word 等可编辑格式？顺序是否按时间、命名是否清晰？
    procedure: P5
  - id: Q-CZ-004
    ask: CZ-1 评估目的对应的经济行为文件是否含：经济行为实施主体申请文件、批准文件、实施方案等？
    procedure: P1
  - id: Q-CZ-005
    ask: CZ-2 评估申报明细表是否盖章？
    procedure: P5
  - id: Q-CZ-006
    ask: CZ-3 访谈记录是否归档？（单项评估不需要）
    procedure: P5
  - id: Q-CZ-007
    ask: CZ-4 评估对象权益状况相关协议、章程、股权证明等法律文件（出资协议、股权证书、股东清单、股权买卖/回购协议等）是否齐全？
    procedure: P5
  - id: Q-CZ-008
    ask: CZ-5-1 被评估单位历史沿革、控股股东及持股比例资料（成立与经营时间、股权变动、章程、验资报告、工商变更通知等）是否齐全？
    procedure: P5
  - id: Q-CZ-009
    ask: CZ-5-2 企业经营管理结构和产权架构资料（子公司股权结构图、组织机构图等）是否齐全？
    procedure: P5
  - id: Q-CZ-010
    ask: CZ-6 被评估单位业务、资产、财务、人员及经营状况资料（财务报表、审计报告、主要业务资料、优劣势、销售市场与方式、核心技术研发及特许经营权、员工人数、管理层情况等）是否齐全？
    procedure: P5
  - id: Q-CZ-011
    ask: CZ-7-1 经营计划、发展规划（董事会/经理办公会通过文件、近若干年纳税记录、财务预算或可研、行业竞争地位等）是否齐全并盖章扫描？
    procedure: P5
  - id: Q-CZ-012
    ask: CZ-7-2 被评估单位未来收益预测资料是否齐全？（收益法、市场法适用）
    procedure: P5
  - id: Q-CZ-013
    ask: CZ-8 评估对象/被评估单位以往的评估及交易资料是否齐全？（企业价值评估适用）
    procedure: P5
  - id: Q-CZ-014
    ask: CZ-9 影响被评估单位经营的宏观、区域经济因素资料是否齐全？（企业价值评估适用）
    procedure: P5
  - id: Q-CZ-015
    ask: CZ-10 被评估单位所在行业现状与发展前景资料是否齐全？（企业价值评估适用）
    procedure: P5
  - id: Q-CZ-016
    ask: CZ-11 可比企业的经营情况、财务信息（审计报告）、股票价格或股权交易价格资料是否齐全？（市场法适用）
    procedure: P5
  - id: Q-CZ-017
    ask: CZ-12 证券市场、产权交易市场等市场有关资料是否齐全？（市场法适用）
    procedure: P5
  - id: Q-CZ-018
    ask: CZ-13 与委托方/相关当事方沟通基础上的资产配置与使用情况、非经营性资产/负债和溢余资产的分析或说明是否齐全？（收益法、市场法适用）
    procedure: P5
  - id: Q-CZ-019
    ask: CZ-14 对长期股权投资项目的分析（是否单独评估的判断）是否齐全？
    procedure: P5
  - id: Q-CZ-020
    ask: CZ-21 重要的利用专家工作及相关报告情况是否齐全？不涉及的是否已删除该文件夹？
    procedure: P5
  - id: Q-CZ-021
    ask: 经营计划、发展规划及未来收益预测表是否要求加盖公章并存放盖章扫描件？无法提供的能否在访谈记录中体现并对文件夹备注？
    procedure: P5
  - id: Q-CZ-022
    ask: 支撑评估参数的历史财务数据（多期）、行业数据、宏观与区域经济数据是否收集完备并注明来源？
    check: T-DC-04（64条）：基础资料收集不完备
    procedure: P5
- id: financial-general
  name: 资产基础法-财务类通用
  source: 指引 财务类操作指引 + 全科目步骤及复核表
  questions:
  - id: Q-FG-001
    ask: 每个科目是否都有《评估步骤及复核表》，是否逐项勾选「是/不适用」并经复核人签字？
    check: 各科目 步骤原文见 questions/步骤复核表.yaml
    procedure: P8
  - id: Q-FG-002
    ask: 每个科目是否都有核实表？索引号是否清晰？实质性核验底稿文件名是否与核实表索引号一一对应？
    procedure: P8
  - id: Q-FG-003
    ask: 核实表是否通过「评估小助手」统一编制并批量打印？是否已将填表人姓名改为复核人姓名？
    procedure: P4
  - id: Q-FG-004
    ask: 涉及函证的科目：具备独立发函条件的是否由评估机构独立发函？取得的纸质回函是否扫描归档、纸质是否同时归档？
    procedure: P4
  - id: Q-FG-005
    ask: 引用审计函证的是否与原件核对一致、在签字表签字确认并标注核对日期？共用函证是否做好索引？
    procedure: P4
  - id: Q-FG-006
    ask: 无回函的是否在核实表备注未回函，并在文件名标注「未回函」？
    procedure: P4
  - id: Q-FG-007
    ask: 是否按要求执行替代测试、期后测试并归档？
    procedure: P4
  - id: Q-FG-008
    ask: 有评估增减值的科目是否分析增减值原因？
    procedure: P6
  - id: Q-FG-009
    ask: 有无非记账本位币账户？如有是否按评估基准日汇率折算、评估值按本位币确定？
    procedure: P6
  - id: Q-FG-010
    ask: 有无需要在报告中特别说明的事项？
    procedure: P7
  - id: Q-FG-011
    ask: 涉及收益法/市场法时是否识别溢余资产与非经营性资产、负债？
    check: 溢余资产：与经营无直接关系、超过经营所需的多余资产，主要在货币资金科目，周期长的大额定期存款/存单一般作为溢余资产
    procedure: P6
  - id: Q-FG-012
    ask: 非经营性资产/负债判断是否遵循实质原则（收益预测中是否考虑其收入成本相关现金流，如交易性金融资产、投资性房地产、与经营无关的保证金/代垫款/股东分红/关联往来等）？是否在核实表标注？
    procedure: P6
  - id: Q-FG-013
    ask: 针对非经营性资产/负债，是否判断其对评估结论的影响水平并执行核查验证程序？
    procedure: P6
- id: financial-focus
  name: 资产基础法-财务类重点科目
  source: 指引 财务类 1-6 各节
  questions:
  - id: Q-FF-001
    ask: 现金盘点表是否由盘点人、监盘人（评估人员）、财务负责人三方亲笔签字并加盖被评估单位公章？签字盖章版是否扫描归档？
    procedure: P4
  - id: Q-FF-002
    ask: 银行存款是否取得函证、对账单、余额调节表？具备独立发函条件的是否独立发函？未回函如何处理？
    procedure: P4
  - id: Q-FF-003
    ask: 其他货币资金的函证若与银行存款为同一函证，是否在函证索引号中列示（如「见银行存款1」）？
    procedure: P4
  - id: Q-FF-004
    ask: 往来款项：具备独立发函条件的是否独立发函？审计函证是否与原件核对并签字、标注日期？
    procedure: P4
  - id: Q-FF-005
    ask: 往来款项核实表与文件夹/文件名称的索引号是否一一对应？
    procedure: P8
  - id: Q-FF-006
    ask: 存货：发出商品纸质函证是否扫描归档、纸质同时归档？审计函证是否与原件核对一致并签字标注日期？
    procedure: P4
  - id: Q-FF-007
    ask: 存货的评估计算表、询价资料和盘点照片是否有相关评估人员在签字表对应栏目签字确认并标注日期？
    procedure: P6
  - id: Q-FF-008
    ask: 存货盘点表是否签字盖章？异地存货是否函证？
    procedure: P4
  - id: Q-FF-009
    ask: 借款类是否函证？是否可根据银行存款函证编制并做好索引（不重复复印）？银行借款合同文件命名是否与核实表索引号一致？
    procedure: P4
  - id: Q-FF-010
    ask: 金融资产和负债是否编制核实表并做好索引，文件名称与索引号一致？评估计算表等涉及签字的资料是否签字确认？
    procedure: P4
  - id: Q-FF-011
    ask: 其他科目是否编制核实表并做好索引，文件名称与索引号一致？涉及计算及核对的底稿是否由评估人员签字确认并标注日期？
    procedure: P4
  - id: Q-FF-012
    ask: 应收款项是否实施账龄分析及其他分析程序，并在坏账分析表中列示？坏账及预计坏账损失是否有依据、是否收集证据？
    procedure: P6
  - id: Q-FF-013
    ask: 对有确凿依据为坏账的款项是否查明原因、取证，评估为零是否有说明？贷方余额是否做重分类调整？
    procedure: P6
  - id: Q-FF-014
    ask: 负债类及账外资产负债（对外担保、未决诉讼、承诺事项、经营租赁等）是否识别并形成核实底稿？
    check: T-DC-06（54条）
    procedure: P5
- id: nonfinancial
  name: 资产基础法-非财务类（土地/房屋/设备/无形资产等）
  source: 指引 第四部分三、四 + 目录
  questions:
  - id: Q-NF-001
    ask: 土地使用权/房屋建筑物/设备等非财务类科目是否严格按各科目《步骤及复核表》执行？
