title: 2024年处罚监管问题映射（底稿复核视角）
purpose: 把 2024 年监管处罚/自律惩戒中的问题事实，按八大基本程序与主题聚类，映射到 questions/底稿问题集.yaml，标出覆盖缺口与建议新增条目，为问题集提供「监管实际处罚」这一负向清单依据。
