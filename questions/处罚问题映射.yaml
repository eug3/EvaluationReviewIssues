  - （2）毛利率方面。某企业历史年度2019年、2020年1-11月毛利率分别为-64.5%、-91.96%，预测期直接采用委托人提供的经营预测资料，2021年毛利率大幅提高至28%，2022-2030年毛利率在22%-24%之间，缺少必要的分析判断。
