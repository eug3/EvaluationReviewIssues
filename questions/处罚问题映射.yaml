- id: T-VA-02
  name: 评估方法选取不当或未论证适用性
  procedure: P6
  hits: 78
  primary_hits: 58
  share: 6.7
  covered_by: []
  covered_groups: []
  gap: true
  added_by:
  - Q-SB-002
  examples:
  - 评估方法适用性分析不全面
  - 1.收益法评估中遗漏出租厂房收入。被评估单位评估基准日其他业务收入为厂房租赁收入，根据基准日财务数据和评估报告预测，2022年房屋租赁收入合计为1,945.18万元，评估底稿显示，租赁合同结束日期为2025年4月30日。报告评估未对2023年及以后年度该项收入进行预测。
  - （一）评估模型选用不恰当。 该报告采用倍加系数模型确定评估对象商标的重置成本，倍加系数法适用于投入智力比较多的技术型无形资产。但根据该报告披露，“对于本次评估的无形资产，没有过多无形资产研发中的物化劳动消耗和活劳动消耗”，不应适用倍加系数法。
    上述问题违反了《商标资产评估指导意见》第二十三条的规定。
- id: T-VA-09
  name: 计算公式、勾稽或汇总错误
  procedure: P6
  hits: 78
  primary_hits: 42
  share: 6.7
  covered_by:
