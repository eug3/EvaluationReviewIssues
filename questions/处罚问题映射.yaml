  - Q-SB-004
  examples:
  - 收益法永续期折现系数计算错误。收益法计算表中“以后年度”即永续期的折现系数计算公式错误，错将2027年折现年限链接为2026年折现年限，导致评估结论差异7,200万元（在其他条件不变的情况下，造成高估），差异率为14.3%。
  - （一）价值比率计算有误。 在计算价值比率修正系数时，评估人员未引用正式审计报告数据，且营业总收入（同比增长率）、速动比率、总资产（同比增长率）链接错误。上述问题导致评估差异814.58万元（在其他条件不变的情况下，造成高估），差异率4.22%。
  - （三）折现年限计算有误。 该报告底稿“无形资产组合技术评估计算表（税前）”中，2022年4—12月、2023—2027年的折现年限分别按照0.38、1.38、2.38、3.38、4.38、5.38计算。…
